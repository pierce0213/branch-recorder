<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日分支记录器 · 画布版</title>
<style>
/* ---------- 浅色主题（默认） ---------- */
:root{
  --bg:#eef1f6; --card:#ffffff; --card2:#f5f7fb;
  --line:#e0e5ee; --line2:#d3d9e5; --line3:#bcc4d4;
  --txt:#151b2b; --dim:#4c5568; --mute:#6e788e;
  --blue:#3b6ef5; --cyan:#0891a6; --green:#12a150; --orange:#dd8a00;
  --red:#e04a42; --purple:#7c4ddb; --pink:#db2777;
  --r:12px;

  /* 主题化扩展变量 */
  --surface:#ffffff; --surface-1:#f3f5f9; --surface-2:#f5f7fb; --surface-3:#f7f9fc;
  --panel-bg:rgba(255,255,255,.86); --panel-shadow:0 8px 26px rgba(24,35,58,.10);
  --inspector-bg:rgba(255,255,255,.96); --input-bg:#ffffff;
  --modal-bg:#ffffff; --pop-bg:#ffffff; --ctx-bg:#ffffff;
  --card-shadow:0 1px 2px rgba(24,35,58,.06),0 6px 16px rgba(24,35,58,.07);
  --card-shadow-hi:0 0 0 2px var(--blue-soft),0 10px 26px rgba(59,110,245,.16);
  --drop-shadow:0 14px 34px rgba(24,35,58,.16);
  --blue-soft:rgba(59,110,245,.10);
  --edge:#c4cddc; --ghost:#3b6ef5;
  /* 连线：静止轨道 / 沿线的光弹 / 通电高亮 */
  --edge-flow:#3b6ef5; --edge-flow-hot:#1d4ed8;
  --edge-base-op:.9; --edge-halo-op:.10; --edge-glow-op:.17;
  /* 光弹跑完一条线用的时间（所有线一致，节奏才整齐） */
  --flow-dur:1.6s;
  --well:#f3f5f9; --mm-node:#c9d1de;
  --scrim:rgba(255,255,255,.22);
  --mask:rgba(15,23,42,.36);
  --toast-bg:#222a3d; --toast-fg:#ffffff;
  --danger-bg:#fdecea; --danger-fg:#c0392b;
  --scroll-thumb:#cfd6e2; --scroll-thumb-hi:#bcc5d5;
  --topbar-grad:linear-gradient(to bottom,rgba(238,241,246,.96),rgba(238,241,246,.74) 62%,rgba(238,241,246,0));
  --glow:radial-gradient(760px 460px at 26% -6%,rgba(59,110,245,.10),transparent 70%),
         radial-gradient(620px 420px at 88% 8%,rgba(124,77,219,.08),transparent 72%);
  --logo-shadow:0 4px 14px rgba(59,110,245,.28);
}
/* ---------- 深色主题 ---------- */
body.dark{
  --bg:#0a0a0b; --card:#141416; --card2:#1a1a1d;
  --line:#232326; --line2:#2e2e33; --line3:#3a3a41;
  --txt:#e9e9ec; --dim:#9a9aa2; --mute:#6b6b73;
  --blue:#5b8cff; --cyan:#22d3ee; --green:#2fbf6b; --orange:#f0a92a;
  --red:#f0524a; --purple:#a970ff; --pink:#ec4899;

  --surface:#141416; --surface-1:#161619; --surface-2:#1a1a1d; --surface-3:#1c1c1f;
  --panel-bg:rgba(20,20,22,.9); --panel-shadow:0 10px 30px rgba(0,0,0,.45);
  --inspector-bg:rgba(18,18,20,.96); --input-bg:#1b1b1e;
  --modal-bg:#131316; --pop-bg:#17171a; --ctx-bg:#1a1a1d;
  --card-shadow:0 6px 20px rgba(0,0,0,.35);
  --card-shadow-hi:0 0 0 1px var(--blue),0 12px 34px rgba(0,0,0,.55);
  --drop-shadow:0 18px 44px rgba(0,0,0,.6);
  --blue-soft:rgba(91,140,255,.14);
  --edge:#2c2c34; --ghost:#5b8cff;
  --edge-flow:#5b8cff; --edge-flow-hot:#a9c8ff;
  --edge-base-op:.95; --edge-halo-op:.22;
  --edge-glow-op:.20;
  --flow-dur:1.6s;
  --well:#0e0e10; --mm-node:#3a3a42;
  --scrim:rgba(0,0,0,.18);
  --mask:rgba(6,6,8,.72);
  --toast-bg:#232327; --toast-fg:#e9e9ec;
  --danger-bg:#3a1e1c; --danger-fg:#f0857d;
  --scroll-thumb:#2f2f35; --scroll-thumb-hi:#3d3d45;
  --topbar-grad:linear-gradient(to bottom,rgba(10,10,11,.94),rgba(10,10,11,.72) 62%,rgba(10,10,11,0));
  --glow:radial-gradient(760px 460px at 26% -6%,rgba(91,140,255,.07),transparent 70%),
         radial-gradient(620px 420px at 88% 8%,rgba(169,112,255,.05),transparent 72%);
  --logo-shadow:0 4px 14px rgba(91,140,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  /* 字体链含 Linux 中文字形（Noto Sans CJK / 思源 / 文泉驿），否则 Linux 下中文变方块 */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;
  font-size:14px; line-height:1.55; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
*{scrollbar-width:thin;scrollbar-color:#2f2f35 transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2f2f35;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3d3d45}
svg{display:block}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ================= 画布 ================= */
#canvas{
  position:fixed; inset:0; overflow:hidden; touch-action:none;
  background-color:var(--bg); cursor:grab;
}
#canvas.panning{cursor:grabbing}
/* 画布底色永远干净：不再画点阵 / 格线。底子要么是主题纯色，要么是用户自己的图 */
/* 注意：不要在 #stage 上常驻 will-change:transform。
   常驻会让浏览器把它提升为合成层、只栅格化一次，缩放后文字被拉伸→整片发虚。
   只在拖拽/缩放进行中挂 .moving 走合成层（流畅），停下再撤掉，让浏览器
   按最终比例重新栅格化，文字恢复清晰。 */
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage.moving{will-change:transform}
#edges{position:absolute;left:-4000px;top:-4000px;width:8000px;height:8000px;overflow:visible;pointer-events:none}
/* 连线几何：具体颜色 / 粗细 / 动画见文末「电流连线」段 */
#edgeG path,#ghostG path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#nodes{position:absolute;left:0;top:0}
#glow{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(760px 460px at 26% -6%, rgba(91,140,255,.07), transparent 70%),
             radial-gradient(620px 420px at 88% 8%, rgba(169,112,255,.05), transparent 72%);
}

/* ================= 节点卡（updream 风格） ================= */
.nd{position:absolute;left:0;top:0;width:264px;user-select:none}
.nd-head{display:flex;align-items:center;gap:7px;padding:0 2px 7px;font-size:11.5px;color:var(--dim)}
.nd-badge{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.nd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-kids{font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex-shrink:0}
.nd-card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:10px;cursor:pointer;
  transition:border-color .14s, box-shadow .14s, background .14s;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
.nd-card:hover{border-color:var(--line3);background:#161618}
.nd.sel .nd-card{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 12px 34px rgba(0,0,0,.55)}
.nd.sel{z-index:4}
.nd.dropin .nd-card{border-color:var(--green);box-shadow:0 0 0 2px var(--green),0 12px 34px rgba(0,0,0,.55)}
.nd.dim{opacity:.22;filter:saturate(.3)}
.nd.hit .nd-card{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.nd.dragging{z-index:6;opacity:.92;pointer-events:none}
.nd.dragging .nd-card{box-shadow:0 18px 44px rgba(0,0,0,.6)}
.nd-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
  background:#1c1c1f;border:1px solid var(--line);border-radius:20px;padding:2px 9px;line-height:1.5;
}
.nd-chip i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.nd-inner{margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;transition:border-color .14s}
.nd-card:hover .nd-inner{border-color:#2a2a30}
.nd-title{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-add{
  flex-shrink:0;display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--dim);
  background:#222226;border:1px solid var(--line2);border-radius:7px;padding:2.5px 8px;transition:.14s;
}
.nd-add:hover{color:var(--txt);background:#2b2b31;border-color:var(--line3)}
.nd-sub{font-size:12.5px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-note{
  font-size:12.5px;color:var(--txt);margin-top:6px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.nd-void{
  margin-top:8px;min-height:46px;border:1px dashed #2b2b31;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--mute);font-size:11px;text-align:center;padding:8px;
}
.nd-void svg{width:18px;height:18px;stroke:#3a3a41;fill:none;stroke-width:1.4}
.nd-foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:9px;padding:0 2px}
.nd-foot svg{width:12px;height:12px;stroke:#4a4a52;fill:none;stroke-width:1.5;flex-shrink:0}
.nd-foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== 节点内的图片：一张卡可以放多张，按张数排成自适应网格 =====
   --cols / --ph 由行内样式给出：1 张全宽、2 张两列、3 张一行、4 张 2×2、
   5 张以上九宫格。每格都是固定高度，所以卡片高度不依赖图片有没有加载完，
   measure() 量到的就是最终值，布局不会「先矮一截再撑开」。 */
.nd-photos{margin-top:8px;display:grid;gap:4px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))}
.nd-ph{
  position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--surface-1);cursor:zoom-in;
}
.nd-ph img{display:block;width:100%;height:var(--ph,132px);object-fit:cover}
.nd-ph::after{
  content:"点开看大图";position:absolute;right:6px;bottom:6px;font-size:10px;
  color:#fff;background:rgba(10,12,20,.62);border-radius:5px;padding:1px 6px;
  opacity:0;transition:opacity .14s;pointer-events:none;
}
.nd-photos:hover .nd-ph:first-child::after{opacity:1}
/* 超过 9 张时最后一格盖一层「＋N」 */
.nd-ph-more{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,10,18,.58);color:#fff;font-size:14px;font-weight:600;letter-spacing:.5px;
}
/* 编辑态 / 详情面板里的多图：三列小格，每格右上角一个删除键 */
.nd-imgbox{margin-bottom:8px}
.nd-img-grid{display:grid;gap:5px;grid-template-columns:repeat(3,minmax(0,1fr))}
.nd-img-cell{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line2);background:var(--surface-1)}
.nd-img-cell img{display:block;width:100%;height:74px;object-fit:cover;cursor:zoom-in}
.nd-img-del{
  position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;
  color:#fff;background:rgba(12,14,22,.66);transition:.12s;
}
.nd-img-del:hover{background:var(--danger-fg)}
.nd-img-bar{display:flex;gap:5px;margin-top:5px}
.nd-img-bar button{
  flex:1;font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--line2);
  color:var(--dim);background:var(--surface-1);transition:.12s;
}
.nd-img-bar button:hover{border-color:var(--line3);color:var(--txt)}
.nd-img-bar button[data-a="delimg"]:hover{background:var(--danger-bg);color:var(--danger-fg);border-color:transparent}
.nd-img-add{
  width:100%;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px dashed var(--line3);border-radius:8px;padding:11px 8px;
  color:var(--mute);font-size:11.5px;background:transparent;transition:.14s;
}
.nd-img-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.nd-img-add svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
/* 把图片拖到某张卡片上时的落点提示 */
.nd.imgdrop .nd-card{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan),var(--drop-shadow)}
/* 大图预览（独立浮层，不带卡片底色） */
#lightbox{
  position:fixed;inset:0;z-index:90;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;
  background:rgba(8,10,18,.78);backdrop-filter:blur(4px);
}
#lightbox.on{display:flex}
#lightbox img{
  max-width:92vw;max-height:76vh;border-radius:12px;background:#fff;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
}
.lb-cap{color:#e9e9ec;font-size:12.5px;max-width:80vw;text-align:center}
.lb-foot{display:flex;gap:8px;align-items:center}
.lb-idx{color:#c9cbd6;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
.nd-tools{
  position:absolute;display:flex;gap:1px;z-index:3;
  background:#1b1b1f;border:1px solid var(--line2);border-radius:8px;padding:2px;
  opacity:0;pointer-events:none;transition:opacity .14s;box-shadow:0 6px 18px rgba(0,0,0,.5);
}
.nd:hover .nd-tools,.nd.sel .nd-tools{opacity:1;pointer-events:auto}
.nd-tools button{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.nd-tools button:hover{background:#2c2c33;color:var(--txt)}
.nd-tools button[data-a="del"]:hover{background:#3a1e1c;color:#f0857d}
.nd-tools svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}

/* ================= 顶栏 ================= */
#topbar{
  position:fixed;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:10px;
  padding:0 14px;z-index:40;
  background:linear-gradient(to bottom, rgba(10,10,11,.94), rgba(10,10,11,.72) 62%, rgba(10,10,11,0));
}
.tb-left{display:flex;align-items:center;gap:6px;min-width:0}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.logo{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:linear-gradient(140deg,#6d5cff,#3f7bff 55%,#22d3ee);
  box-shadow:0 4px 14px rgba(91,140,255,.35);
}
.logo svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico-btn{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);transition:.14s;flex-shrink:0;
}
.ico-btn:hover{background:#1e1e21;color:var(--txt)}
.proj{
  background:transparent;border:1px solid transparent;border-radius:8px;outline:none;
  font-size:13.5px;font-weight:600;color:var(--txt);padding:3px 7px;max-width:230px;min-width:60px;
  transition:.14s;
}
.proj:hover{border-color:var(--line)}
.proj:focus{border-color:var(--blue);background:#141416}
.pill{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;
  background:#161618;border:1px solid var(--line);color:var(--dim);font-size:12px;transition:.14s;
  white-space:nowrap;
}
.pill:hover{border-color:var(--line3);color:var(--txt);background:#1c1c1f}
.pill b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.pill .ico{width:14px;height:14px}
.pill.accent .ico{stroke:var(--blue)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;
  border:1px solid var(--line2);color:var(--dim);font-size:12.5px;transition:.14s;white-space:nowrap;
}
.btn-ghost:hover{border-color:var(--line3);color:var(--txt);background:#1a1a1d}
.btn-ghost.on{border-color:var(--blue);color:var(--txt);background:rgba(91,140,255,.12)}
.search-wrap{display:flex;align-items:center;gap:0;height:30px;border:1px solid transparent;border-radius:9px;transition:.16s}
.search-wrap input{
  width:0;opacity:0;background:transparent;border:none;outline:none;font-size:12.5px;
  transition:width .18s, opacity .18s;padding:0;
}
.search-wrap.on{background:#161618;border-color:var(--line);padding-right:10px}
.search-wrap.on input{width:170px;opacity:1}

/* ================= 左侧工具条 ================= */
#toolbar{
  position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;gap:3px;padding:6px;
  background:rgba(20,20,22,.86);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.tool{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);transition:.14s;
}
.tool:hover{background:#232327;color:var(--txt)}
.tool.on{background:rgba(91,140,255,.14);color:var(--blue)}
.tool-sep{height:1px;background:var(--line);margin:4px 5px}

/* ================= 底栏 ================= */
#bottombar{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:2px;height:42px;padding:0 8px;
  background:rgba(20,20,22,.9);border:1px solid var(--line);border-radius:13px;
  backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.bb{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:.14s}
.bb:hover{background:#232327;color:var(--txt)}
.bb.on{color:var(--blue);background:rgba(91,140,255,.13)}
.bb[disabled]{opacity:.32;cursor:default}
.bb[disabled]:hover{background:none;color:var(--dim)}
.bb-zoom{
  min-width:52px;height:32px;border-radius:9px;color:var(--dim);font-size:12px;
  font-variant-numeric:tabular-nums;transition:.14s;
}
.bb-zoom:hover{background:#232327;color:var(--txt)}
.bb-sep{width:1px;height:20px;background:var(--line);margin:0 5px}

/* ================= 小地图 ================= */
#minimap{
  position:fixed;left:16px;bottom:16px;width:170px;z-index:35;
  background:rgba(20,20,22,.9);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.mm-head{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 10px;font-size:11px;color:var(--mute)}
.mm-head button{width:20px;height:20px;border-radius:6px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.mm-head button:hover{background:#232327;color:var(--txt)}
.mm-body{position:relative;height:104px;margin:0 8px 8px;background:#0e0e10;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:crosshair}
.mm-body.folded{display:none}
.mm-node{position:absolute;border-radius:2px;background:#3a3a42}
.mm-node.sel{background:var(--blue)}
.mm-view{position:absolute;border:1px solid rgba(91,140,255,.75);background:rgba(91,140,255,.1);border-radius:3px;pointer-events:none}

/* ================= 右侧详情面板 ================= */
#inspector{
  position:fixed;right:14px;top:64px;bottom:16px;width:340px;z-index:45;
  display:none;flex-direction:column;

/* =========================================================
   主题变量驱动层（放在最后，覆盖上面的深色硬编码色）
   ========================================================= */
*{scrollbar-color:var(--scroll-thumb) transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb)}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hi)}
#glow{background:var(--glow)}
.logo{box-shadow:var(--logo-shadow)}

/* =========================================================
   连线：一条静止的细轨道 + 一颗粒子沿线走完全程
   —— 比「虚线跑马灯」好看的关键在两点：
   ① 每条线用 pathLength="100" 归一化，dash 按「占整条线的百分比」算，
      所以不管线长线短，一条线上永远只有一颗光点；否则密集虚线在
      短线里挤三颗、长线里排五颗，整屏就是一团蚂蚁线。
   ② 光弹 = 柔光外圈 + 亮芯两层同相叠加，像一颗粒子在管里跑，
      不再是均匀断开的虚线；平时整条线不发光，只有通电时才亮。
   所有 path 都带 non-scaling-stroke，缩放时刻度不变形。
   ========================================================= */
#edgeG .e{color:var(--edge-flow)}
#edgeG .e.on{color:var(--edge-flow-hot)}
/* 1) 轨道：常驻细实线，保证主干拓扑任何时候都看得清 */
#edgeG .e-base{stroke:var(--edge);stroke-width:1.6;opacity:var(--edge-base-op)}
/* 2) 整线光晕：平时完全不发光，只有「通电」时才亮 */
#edgeG .e-halo{stroke:currentColor;stroke-width:6;opacity:0;transition:opacity .22s}
#edgeG .e.on .e-halo{opacity:var(--edge-halo-op)}
/* 3) 光弹：亮芯 10% + 拖尾 30%，两层同一相位、同一条线
      → 亮芯在前、柔光拖在后，像一粒光在管里划过（而不是一截截均匀虚线） */
#edgeG .e-glow,
#edgeG .e-flow{
  stroke:currentColor;stroke-linecap:round;
  animation:edgeFlow var(--flow-dur,1.6s) linear infinite;
}
#edgeG .e-glow{stroke-width:7;stroke-dasharray:30 70;opacity:var(--edge-glow-op,.15)}
#edgeG .e-flow{stroke-width:2.5;stroke-dasharray:10 90}
/* 深色主题下让光弹自己发光；边太多时不加，避免每帧模糊上百条 path */
body.dark #edgeG.hiflow .e-flow{filter:drop-shadow(0 0 3px currentColor)}
/* 选中 / 悬停某张卡片时，与它相连的线上「通电」 */
#edgeG .e.on .e-base{stroke:currentColor;opacity:.45}
#edgeG .e.on .e-glow{opacity:.30}
#edgeG .e.on .e-flow{stroke-width:2.9}
/* 整棵树缩得很小时（边多、又看不清）直接停掉动画，拖拽不掉帧 */
#edgeG.paused .e-glow,#edgeG.paused .e-flow{animation-play-state:paused}
@keyframes edgeFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}

/* 拖拽预览线用同一套语言 */
#ghostG .g-halo{stroke:var(--ghost);stroke-width:6;opacity:.12}
#ghostG .g-glow,
#ghostG .g-flow{
  stroke:var(--ghost);stroke-linecap:round;
  animation:edgeFlow var(--flow-dur,1.6s) linear infinite;
}
#ghostG .g-glow{stroke-width:7;stroke-dasharray:30 70;opacity:.18}
#ghostG .g-flow{stroke-width:2.5;stroke-dasharray:10 90}

/* 系统开了「减少动态效果」：去掉光弹，退成一条安静的实线 */
@media (prefers-reduced-motion: reduce){
  #edgeG .e-glow,#ghostG .g-glow{display:none}
  #edgeG .e-flow,#ghostG .g-flow{animation:none!important;stroke-dasharray:none;opacity:.85}
}

/* 左侧接线口：给电流连线一个明确的落点，整棵树看着像块电路板 */

  position:absolute;left:-4px;top:50%;margin-top:-3.5px;width:7px;height:7px;border-radius:50%;
  background:var(--edge-flow);opacity:.5;pointer-events:none;z-index:4;
  transition:opacity .15s,box-shadow .15s;
}

  position:absolute;right:-11px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line3);cursor:crosshair;z-index:5;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .15s,border-color .15s,transform .15s;
}
.nd-port::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line3);transition:background .15s}

.nd-port:hover::before{background:var(--blue)}
.nd-port.dragging{border-color:var(--blue);opacity:1;transform:scale(1.2)}
.nd-port.dragging::before{background:var(--blue)}

  border:1.5px dashed var(--blue);background:var(--blue-soft);pointer-events:none;

/* 背景设置面板 */

.bg-th{
  height:56px;border-radius:10px;border:1.5px solid var(--line2);cursor:pointer;position:relative;
  overflow:hidden;background-color:var(--surface-2);background-size:cover;background-position:center;transition:.14s;
}
.bg-th:hover{border-color:var(--line3)}
.bg-th.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.bg-th span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;text-align:center;padding:2px 0;background:rgba(20,26,40,.5);color:#fff}
.rng{display:flex;align-items:center;gap:10px;margin-top:10px}
.rng>span{font-size:11.5px;color:var(--mute);min-width:76px}
.rng input[type=range]{flex:1;accent-color:var(--blue)}
.rng b{font-size:11.5px;color:var(--dim);font-weight:500;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.bg-drop{
  margin-top:6px;border:1.5px dashed var(--line3);border-radius:11px;padding:16px;text-align:center;
  font-size:12.5px;color:var(--mute);transition:.14s;
}
.bg-drop.hot{border-color:var(--blue);background:var(--blue-soft);color:var(--dim)}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12px;color:var(--dim)}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--card-shadow)}

/* =========================================================
   触屏适配（必须放在样式表最后：上面的主题层里有同名规则，
   位置比它早的同优先级规则会被盖掉）
   ========================================================= */
@media(hover:none){
  .nd-tools{opacity:1;pointer-events:auto}
  .nd-port{opacity:1;pointer-events:auto}
  /* 触屏没有 hover，按钮要一直露着，点按目标也要够大（手指约 9mm） */
  .nd-tools button{width:30px;height:30px;border-radius:8px}
  .nd-tools svg{width:16px;height:16px}
  .nd-add{padding:7px 13px;font-size:12px}
  .nd-chip{padding:6px 13px;font-size:12px}
  .nd-chiprow button{padding:7px 13px;font-size:12px}
  .nd-stars span{font-size:20px;padding:2px 1px}
  .nd-ti{padding:8px 10px;font-size:13px}
  .nd-ti-time{font-size:13px;padding:6px 6px;width:88px}
  .nd-img-add{padding:14px 10px;font-size:12.5px}
  .nd-img-bar button{padding:9px 10px;font-size:12px}
  .lb-foot .btn{padding:9px 16px;font-size:13px}
  .nd-card{padding:12px}
  .nd-port{width:26px;height:26px;right:-13px;margin-top:-13px}
}

/* =========================================================
   测试版新增层
   —— 区块①：卡片折叠 / 展开两态
   折叠态只留「状态点 + 标题 + 一行摘要」，展开态才铺开时段/评分/备注/图片。
   两态靠**切类**而不是重渲染：重渲染会让 CSS transition 每次都从零开始，
   高度就「跳」而不是「长」。代价是过渡期间卡片高度在变，连线要跟着重排
   （见 JS 里的 reflowFor：过渡那 200ms 内每帧重算一次布局）。
   ========================================================= */
/* 卡片自己管内边距（折叠两态的高度过渡要干净），所以 padding 给到子元素去管。
   但**绝不能**写 overflow:hidden：浮动工具条骑着卡片上边缘、连接端口骑着右边缘，
   一旦这里裁剪，工具条就只剩贴着卡片顶的一条、端口只剩半个圆（实测 zoom 0.4 时
   工具条只剩 24% 面积可见）。裁剪由各子元素自己负责（.nd-body / .nd-photos 等）。 */
.nd-card{padding:0;position:relative;overflow:visible}
.nd-bar{
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--bc,var(--line3));border-radius:var(--r) 0 0 var(--r);
}
.nd-top{display:flex;align-items:center;gap:8px;padding:9px 10px 8px 12px}
.nd-top .nd-title{flex:1;min-width:0;font-size:13px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 折叠时状态胶囊缩成一个圆点，把宽度让给标题 */
.nd:not(.open) .nd-chip{width:22px;padding:2px 0;justify-content:center;border-radius:7px}
.nd:not(.open) .nd-chip .nd-chip-tx{display:none}
.nd-fold{display:flex;align-items:center;gap:7px;padding:0 10px 9px 12px;
  font-size:11.5px;color:var(--mute);min-width:0}
.nd-fold em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nd-fold .nd-fold-r{margin-left:auto;flex-shrink:0;color:var(--dim);
  font-variant-numeric:tabular-nums;letter-spacing:-1px}
/* 折叠态的下内边距必须是 0：box-sizing:border-box 下 max-height 管不住 padding，
   留着 10px 的 padding-bottom 会让每张折叠卡片底部多出一条死白（实测卡片高度 +10px）。 */
.nd-body{
  padding:0 10px 0 12px;max-height:0;opacity:0;overflow:hidden;
  transition:max-height .2s var(--spring,cubic-bezier(.34,1.3,.5,1)),opacity .16s ease,
             padding-bottom .2s var(--spring,cubic-bezier(.34,1.3,.5,1));
}
.nd.open .nd-body{max-height:920px;opacity:1;padding-bottom:10px}
.nd.open .nd-fold{display:none}
.nd.editing .nd-card{padding:10px}
.nd.editing .nd-bar{display:none}
/* 展开态在卡片左缘加一道细竖线，一眼看出「这块内容属于哪个分支」 */
.nd.open .nd-card{border-color:var(--line2)}

/* 区块②：浮动工具条不随画布缩放变形。
   .nd-tools 在 #stage 里，zoom 0.5 时按钮只有一半大、点不中。
   用 --inv（=1/zoom，由 applyTransform 写在 #stage 上）反向缩放，
   屏幕尺寸就恒定了；卡片贴近视口顶部时翻到卡片下方（.tools-below）。

   定位必须用 --inv 反算，不能直接写 top:-12px。
   缩放锚点在工具条右下角，而 top/right 是「局部坐标」，会被画布一起缩：
   只写 top:-12px 时，zoom 1 顶出 12px、zoom 0.65 顶出 17px、zoom 0.4 顶出 21px，
   工具条会往上飘、越缩越远。按 --inv 反算后，顶出量恒为 --to（12 屏幕px）。
   算式：视觉上边缘 = 卡片顶 + top + 高 - 高*inv，令它等于 卡片顶 - --to，
   解得 top = (高 - --to) * inv - 高。 */
.nd-tools{
  --th:28px;   /* 工具条自身高度：22 按钮 + 2×2 padding + 2×1 border */
  --to:12px;   /* 骑出卡片边缘的距离，单位是「屏幕 px」，与画布缩放无关 */
  top:calc((var(--th) - var(--to)) * var(--inv,1) - var(--th));
  right:calc(8px * var(--inv,1));
  transform:scale(var(--inv,1));transform-origin:100% 100%;
}
.nd.tools-below .nd-tools{
  top:auto;bottom:calc((var(--th) - var(--to)) * var(--inv,1) - var(--th));
  transform-origin:100% 0;
}
/* 触屏按钮放大到 30px，工具条整体也就更高（30 + 4 + 2 = 36），--th 要跟着改。 */
@media(hover:none){
  .nd-tools{--th:36px}
}

/* =========================================================
   区块③：底栏「显示设置」浮层 —— 把低频的 4 个开关收起来，
   底栏从 11 个图标降到 7 个（元素仍在 DOM 里，行为不变）。
   ========================================================= */
#dispPanel{
  position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:41;
  display:none;align-items:center;gap:2px;height:44px;padding:0 8px;
  background:var(--panel-bg);border:1px solid var(--line);border-radius:13px;
  backdrop-filter:blur(10px);
}
#dispPanel.on{display:flex}

/* =========================================================
   区块④：大纲视图。与画布双向联动——列表里选中一行，
   画布把它居中并展开；画布上选中卡片，列表跟着滚到那一行。
   ========================================================= */
#outline{
  position:fixed;left:14px;top:64px;bottom:16px;width:300px;z-index:44;
  display:none;flex-direction:column;
  background:var(--panel-bg);border:1px solid var(--line);border-radius:15px;
  backdrop-filter:blur(12px);overflow:hidden;
}
#outline.on{display:flex}
#toolbar{transition:left .22s var(--spring,cubic-bezier(.34,1.3,.5,1))}
.ol-head{display:flex;align-items:center;gap:8px;padding:11px 12px;
  border-bottom:1px solid var(--line);flex-shrink:0;font-size:12.5px;font-weight:600}
.ol-hint{font-size:11px;color:var(--mute);font-weight:400;margin-left:auto}
.ol-body{flex:1;overflow:auto;padding:6px 6px 2px}
.ol-row{
  display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:8px;
  cursor:pointer;font-size:12.5px;color:var(--dim);
}
.ol-row:hover{background:var(--surface-3)}
.ol-row.sel{background:var(--blue-soft);color:var(--txt)}
.ol-tw{
  width:15px;height:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--mute);font-size:9px;border-radius:4px;line-height:1;
}
.ol-tw:hover{background:var(--surface-1);color:var(--txt)}
.ol-tw.leaf{visibility:hidden}
.ol-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.ol-ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-row.sel .ol-ti{font-weight:600}
.ol-tm{font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums;flex-shrink:0}
.ol-foot{padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-shrink:0}

/* =========================================================
   区块⑤：命令面板（Ctrl/Cmd + K）。一个输入框同时干三件事：
   搜节点（回车飞过去）、执行命令、都不匹配就当「新建分支」。
   ========================================================= */
#palette{
  position:fixed;inset:0;z-index:96;display:none;justify-content:center;
  padding:11vh 16px 0;background:var(--mask);backdrop-filter:blur(3px);
}
#palette.on{display:flex}
.pl-box{
  width:min(620px,94vw);max-height:72vh;display:flex;flex-direction:column;
  background:var(--modal-bg);border:1px solid var(--line2);border-radius:15px;
  overflow:hidden;box-shadow:var(--drop-shadow);
}
.pl-in{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.pl-in .ico{color:var(--mute)}
.pl-in input{flex:1;min-width:0;background:transparent;border:none;outline:none;font-size:15px}
.pl-in kbd{
  font-size:10.5px;color:var(--mute);border:1px solid var(--line2);border-radius:5px;
  padding:1px 5px;font-family:inherit;
}
.pl-list{overflow:auto;padding:6px}
.pl-grp{font-size:10.5px;color:var(--mute);padding:7px 10px 3px;letter-spacing:.06em}
.pl-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13px;cursor:pointer}
.pl-it.on{background:var(--blue-soft)}
.pl-it .pl-sub{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-it .pl-k{margin-left:auto;font-size:10.5px;color:var(--mute);flex-shrink:0}
.pl-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.pl-empty{padding:26px 20px;text-align:center;color:var(--mute);font-size:12.5px}

/* =========================================================
   区块⑥：日期热力图（点顶栏日期打开）。
   一格一天，按当天的分支数着色深浅——「哪几天记得多、哪天断了」一眼看到。
   ========================================================= */
.cal-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12.5px}
.cal-top b{flex:1;text-align:center;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-w{text-align:center;font-size:10.5px;color:var(--mute);padding-bottom:2px}
.cal-d{
  aspect-ratio:1/1;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:11px;cursor:pointer;border:1px solid transparent;color:var(--mute);
  background:var(--surface-1);font-variant-numeric:tabular-nums;transition:.12s;
}
.cal-d:hover{border-color:var(--line3);color:var(--txt)}
.cal-d.void{visibility:hidden}
.cal-d.l1{background:rgba(59,110,245,.14);color:var(--dim)}
.cal-d.l2{background:rgba(59,110,245,.30);color:var(--txt)}
.cal-d.l3{background:rgba(59,110,245,.55);color:#fff}
.cal-d.l4{background:rgba(59,110,245,.86);color:#fff}
body.dark .cal-d.l3,body.dark .cal-d.l4{color:#fff}
.cal-d.today{box-shadow:inset 0 0 0 1.6px var(--blue)}
.cal-d.cur{box-shadow:inset 0 0 0 1.6px var(--txt)}
.cal-leg{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10.5px;color:var(--mute)}
.cal-leg i{width:12px;height:12px;border-radius:4px;display:block}

/* =========================================================
   区块⑦：画布上的「拆细一点」幽灵提示。
   原来那句引导挂在右侧属性面板里，面板应该只陈述事实；
   引导改为浮在选中卡片右侧，点一下真的长出一个子分支。
   ========================================================= */
#kidHint{
  position:absolute;left:0;top:0;display:none;align-items:center;gap:7px;
  padding:8px 12px;border:1px dashed var(--line3);border-radius:9px;
  color:var(--mute);font-size:11.5px;background:var(--surface-2);cursor:pointer;
  z-index:2;transform-origin:0 0;white-space:nowrap;
}
#kidHint.on{display:flex}
#kidHint:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
#kidHint svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}

/* =========================================================
   区块⑧：材料与动效。
   玻璃只上浮层（顶栏/工具条/底栏/面板/浮层），卡片本体保持实体——
   卡片一起玻璃化，整块画布会糊成一片。每层补一条 1px 顶部高光，
   边缘才立得住（2026 趋势里说的 responsible glassmorphism）。
   微交互统一 150ms 阻尼弹簧；大跨度动画（整理布局 560ms）另用一套缓动，别混。
   ========================================================= */
#toolbar,#bottombar,#minimap,#dispPanel,#outline,#inspector{
  box-shadow:var(--panel-shadow),inset 0 1px 0 rgba(255,255,255,.42);
}
body.dark #toolbar,body.dark #bottombar,body.dark #minimap,
body.dark #dispPanel,body.dark #outline,body.dark #inspector{
  box-shadow:var(--panel-shadow),inset 0 1px 0 rgba(255,255,255,.055);
}
.tool,.bb,.bb-zoom,.ico-btn{transition:background .14s,color .14s,transform .16s var(--spring,cubic-bezier(.34,1.3,.5,1))}
.tool:active,.bb:active,.ico-btn:active,.bb-zoom:active{transform:scale(.93)}
/* 左侧工具条悬停展开成「图标 + 文字」：纯图标第一次用基本是盲点 */
#toolbar .tool .tl{
  position:absolute;left:42px;top:50%;transform:translateY(-50%) scale(.96);
  background:var(--toast-bg);color:var(--toast-fg);font-size:11.5px;white-space:nowrap;
  padding:4px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .14s,transform .16s var(--spring);
}
#toolbar .tool{position:relative}
#toolbar .tool:hover .tl{opacity:1;transform:translateY(-50%) scale(1)}

/* =========================================================
   区块⑨：大纲面板的「让位」只在宽屏成立。
   窄屏（≤900px，典型 412px 手机）下 300px 的固定侧栏会吃掉 3/4 视口，
   再把工具条推到 left:330、底栏推到 calc(50%+158px)，两者直接出视口。
   窄屏改成**覆盖式抽屉**：铺满宽度、靠头部的 ✕ 关闭，工具条/底栏原地不动。
   这段必须放在样式表最末 —— 上面 #outline 的 width:300px 定义在后，
   同特异性下后者胜，窄屏块排在它前面会被静默盖掉。
   ========================================================= */
@media(min-width:901px){
  body.outline-open #toolbar{left:330px}
  body.outline-open #bottombar{left:calc(50% + 158px)}
  /* 注意：这里**不能**把 .tl 翻到工具条左侧。翻转后标签正好落在
     大纲面板（z-index 44 > 工具条 40）底下，会被整块盖掉。
     工具条右移到大纲右侧之后，右侧本来就是空白画布，标签照旧向右展开即可。 */
}
@media(max-width:900px){
  #outline{left:8px;right:8px;top:58px;bottom:66px;width:auto;z-index:52}
  .ol-hint{display:none}   /* 抽屉里宽度不够，先让位给标题 */
}
/* 触屏：卡内那个「＋ 子分支」文字按钮在 zoom≈0.4 时只剩 13 个屏幕像素，手指点不中。
   它和浮动工具条上「已反向缩放、屏幕尺寸恒定」的 ＋ 完全重复，
   所以触屏下直接去掉，别在界面上留一个永远点不到的目标。
   （#kidHint 已由 syncKidHint 用 scale(1/zoom) 保持屏幕尺寸，不受影响。） */
@media(hover:none){
  .nd-add{display:none}
}
</style>
</head>
<body>

<div id="bgLayer"></div>
<div id="bgPhoto"></div>
<div id="bgScrim"></div>

<div id="canvas">
  <div id="stage">
    <!-- viewBox 必须与 left/top 的 -4000 对齐：svg 挂在 (-4000,-4000)，
         只有让用户坐标也从 -4000 起算，写世界坐标的 path 才会落在 stage 上。
         少了这一句，所有连线都会被平移 4000px 推出屏幕（一直没显示出来就是这个原因）。 -->
    <svg id="edges" viewBox="-4000 -4000 8000 8000"><g id="edgeG"></g><g id="ghostG"></g></svg>
    <div id="dropGhost"></div>
    <div id="nodes"></div>
    <!-- 画布上的「拆细一点」引导：原来这句提示挂在右侧属性面板里，
         面板该只陈述事实，引导放到画布上、点一下真的长出子分支 -->
    <div id="kidHint" title="点一下，在这张卡片下面长出一个子分支">
      <svg viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg><span>点这里拆细一点</span>
    </div>
  </div>
</div>
<div id="glow"></div>

<header id="topbar">
  <div class="tb-left">
    <span class="logo" title="每日分支记录器">
      <svg viewBox="0 0 16 16"><circle cx="4" cy="8" r="1.9"/><circle cx="12" cy="4" r="1.9"/><circle cx="12" cy="12" r="1.9"/><path d="M5.6 7.2 10.4 4.8M5.6 8.8l4.8 2.4"/></svg>
    </span>
    <button class="ico-btn" id="backBtn" title="记录列表（切换日期）">
      <svg class="ico" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
    </button>
    <input class="proj" id="projectInput" value="我的每日记录" spellcheck="false" title="点击改名">
  </div>
  <div class="tb-right">
    <div class="search-wrap" id="searchWrap">
      <button class="ico-btn" id="searchBtn" title="搜索分支">
        <svg class="ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3"/><path d="M10.3 10.3 14 14"/></svg>
      </button>
      <input id="searchInput" placeholder="搜索分支或备注…">
    </div>
    <button class="pill accent" id="statPill" title="查看今日统计">
      <svg class="ico" viewBox="0 0 16 16"><path d="M9 1.6 4.2 9.1h3.1L7 14.4 11.8 7H8.7z"/></svg>
      <b id="pillCount">0</b> 个分支
    </button>
    <button class="pill" id="datePill" title="切换日期">
      <svg class="ico" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2.2v2.4M10.5 2.2v2.4"/></svg>

<script>
/* =========================================================
   数据模型（与旧版完全兼容）
   store = {
     version: 1,
     projectName: "我的每日记录",
     days: { "2026-09-29": { nodes:[ {id,parentId,title,start,end,status,rating,note,
                                     collapsed,x,y} ], nextSeq:1 } }
   }
   x / y 为画布上的手工位置；缺省（null）表示交给自动树形布局
   ========================================================= */
const KEY = 'daily-branch-recorder-v1';
const STATUS = ['专注','分心','休息','事务','娱乐','其他'];
/* 状态颜色本身定义在下面的「主题」区块里，会随主题切换 */

const NW = 264;                 /* 节点宽度 */
const GAPX = 118, GAPY = 40;    /* 兄弟/层级间距 */
const ROOTGAP = 70, PADX = 240, PADY = 190;
const MIN_Z = 0.2, MAX_Z = 2.4;
const POS_LIMIT = 3000;

/* =========================================================
   主题（浅色默认 / 深色可选）
   ========================================================= */
const TKEY = KEY + '-theme';
const BKEY = KEY + '-bg';
const STATUS_DARK  = {专注:'#5b8cff', 分心:'#f0524a', 休息:'#2fbf6b', 事务:'#f0a92a', 娱乐:'#a970ff', 其他:'#6b6b73'};
const STATUS_LIGHT = {专注:'#3b6ef5', 分心:'#e04a42', 休息:'#12a150', 事务:'#dd8a00', 娱乐:'#7c4ddb', 其他:'#8a92a6'};
let THEME = 'light';
function isDark(){ return THEME === 'dark'; }
/* 状态色随主题走：深色用亮的一套，浅色用深的一套 */
function sc(s){ return (isDark() ? STATUS_DARK : STATUS_LIGHT)[s] || (isDark() ? '#6b6b73' : '#8a92a6'); }
/* STATUS_COLOR 保持旧的写法可用（一读就取到当前主题的颜色），不用改一堆调用点 */
const STATUS_COLOR = new Proxy({}, {
  get: (_, k) => (typeof k === 'string' && k in STATUS_DARK) ? sc(k) : undefined
});
function applyTheme(){
  document.body.classList.toggle('dark', isDark());
  const b = document.getElementById('themeBtn');
  if(b){
    b.title = isDark() ? '切换到浅色主题' : '切换到深色主题';
    b.classList.toggle('on', isDark());
  }
  lsSet(TKEY, THEME);
  /* 分支配色是 hsl 算出来的，深浅两套值不同 → 换主题时要让连线重建一遍 */
  EDGE_SKIN++;
  /* 状态点颜色随主题变化，已经画出来的卡片需要重画一遍 */
  const h = document.getElementById('nodes');
  if(h && h.childElementCount) renderNodes();
}
function toggleTheme(){
  THEME = isDark() ? 'light' : 'dark';
  applyTheme();
  toast(isDark() ? '已切到深色主题' : '已切到浅色主题');
}

/* =========================================================
   一级分支配色（测试版新增）
   每条一级分支一个色相，子分支继承同一色相的不同明度——
   于是「这几张卡片是不是同一支」变成一眼可见的事，
   不必再靠连线走向去推。连线的颜色也跟着分支走：
   连线只负责「顺序」，归属交给颜色。
   ========================================================= */
const BRANCH_HUES = [215, 272, 336, 26, 152, 45, 190, 258];   /* 蓝 紫 品 橙 绿 琥珀 青 靛 */
function rootIdOf(id){
  let cur = byId(id), last = id;
  const guard = new Set();
  while(cur && !guard.has(cur.id)){
    guard.add(cur.id); last = cur.id;
    if(cur.parentId == null) break;
    cur = byId(cur.parentId);
  }
  return last;
}
function depthOf(id){
  let d = 0, cur = byId(id);
  const guard = new Set();
  while(cur && cur.parentId != null && !guard.has(cur.id)){ guard.add(cur.id); d++; cur = byId(cur.parentId); }
  return d;
}
/* 根节点在「今天的分支列表」里的序号，决定取哪个色相。
   同一支下面的所有子分支共用它，所以整支同色系。 */
function rootIndex(id){
  const roots = day().nodes.filter(n => n.parentId == null).map(n => n.id);
  const i = roots.indexOf(rootIdOf(id));
  return i < 0 ? 0 : i;
}
function branchColor(id){
  const h = BRANCH_HUES[rootIndex(id) % BRANCH_HUES.length];
  const d = Math.min(4, depthOf(id));
  const L = isDark() ? (64 + d * 5) : (46 + d * 9);
  const S = Math.max(40, (isDark() ? 72 : 66) - d * 6);
  return 'hsl(' + h + ' ' + S + '% ' + L + '%)';
}
/* 通电态不能退回全局蓝，要在同色相里再亮/暗一档，否则「通电」会认错归属 */
function branchColorHot(id){
  const h = BRANCH_HUES[rootIndex(id) % BRANCH_HUES.length];
  const d = Math.min(4, depthOf(id));
  const L = isDark() ? (80 + d * 3) : (32 + d * 6);
  const S = Math.max(48, (isDark() ? 90 : 84) - d * 6);
  return 'hsl(' + h + ' ' + S + '% ' + L + '%)';
}

/* =========================================================
   测试版新增的界面状态
   ========================================================= */
let ALL_OPEN = false;      /* 「全部展开」总开关（Alt+E 切换） */
let chainPid = null;       /* 锁定的父节点：连续拆分模式，Enter 一直往下加 */
let olOpen = false;        /* 大纲面板是否打开 */
let EDGE_SKIN = 0;         /* 主题/配色变更计数，参与连线的重建签名 */

/* =========================================================
   画布背景（底色预设 + 自定义图片）
   ========================================================= */
const BG_PRESETS = {
  plain:{ name:'纯净', css:'', size:'cover' },
  paper:{ name:'暖纸', css:'linear-gradient(160deg,#fdf8ee,#f7efe1 58%,#f2e8d8)', size:'cover' },
  mist:{ name:'雾蓝', css:'linear-gradient(160deg,#eef3ff,#e6ecfb 46%,#f3eefc)', size:'cover' },
  night:{ name:'夜色', css:'linear-gradient(160deg,#0e0e12,#14161c 55%,#0b0b0f)', size:'cover' }
};
const BG_DEFAULT = { preset:'plain', src:'', opacity:.5, blur:0, fit:'cover' };
let BG = JSON.parse(JSON.stringify(BG_DEFAULT));
let bgSaveWarned = false;

function applyBg(){
  const layer = document.getElementById('bgLayer');
  const ph = document.getElementById('bgPhoto');
  if(!layer || !ph) return true;
  const p = BG_PRESETS[BG.preset] || BG_PRESETS.plain;
  layer.style.backgroundImage = p.css || '';
  layer.style.backgroundSize = p.size || 'cover';
  layer.style.backgroundRepeat = 'no-repeat';
  if(BG.src){
    ph.style.backgroundImage = 'url("' + BG.src + '")';
    ph.style.backgroundRepeat = BG.fit === 'tile' ? 'repeat' : 'no-repeat';
    ph.style.backgroundSize = BG.fit === 'tile' ? 'auto' : BG.fit;
    ph.style.opacity = String(BG.opacity);
    ph.style.filter = BG.blur ? ('blur(' + BG.blur + 'px)') : 'none';
    /* 图片被放大或平铺时，模糊会露出边缘 */
    ph.style.transform = BG.blur ? 'scale(1.04)' : 'none';
  } else {
    ph.style.backgroundImage = '';
    ph.style.opacity = '0';
    ph.style.filter = 'none';
    ph.style.transform = 'none';
  }
  return saveBg();
}
function saveBg(){
  if(lsSet(BKEY, JSON.stringify(BG))) return true;
  /* 存储被整个禁用（隐私模式）时，图还是留在这次会话里能看；
     只有「存储能用但这次写不进去」才是配额不够，那就把图丢掉免得整页卡死 */
  if(lsOk && BG.src){
    BG.src = '';
    lsSet(BKEY, JSON.stringify(BG));
    if(!bgSaveWarned){ bgSaveWarned = true; toast('这张图太大，本机存不下，换一张小一点的吧'); }
  }
  return false;
}
function loadBg(){
  try{
    const raw = lsGet(BKEY);
    if(raw){
      const o = JSON.parse(raw);
      BG = Object.assign({}, BG_DEFAULT, o);
      if(!BG_PRESETS[BG.preset]) BG.preset = 'plain';
    }
  }catch(e){ BG = Object.assign({}, BG_DEFAULT); }
}
/* 通用图片压缩：文件 → dataURL，按最长边等比缩放并转 JPEG，控制单张体积。
   背景图和卡片图都走这里，免得两套实现慢慢跑偏。 */
function compressImage(file, maxEdge, quality, cb){
  if(!file) return;
  if(!/^image\//.test(file.type || '')) return cb('请选择图片文件（jpg / png / webp 都行）');
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(w > maxEdge){ h = Math.round(h * maxEdge / w); w = maxEdge; }
      if(h > maxEdge){ w = Math.round(w * maxEdge / h); h = maxEdge; }
      let out = fr.result;
      try{
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#ffffff';
        cx.fillRect(0, 0, w, h);
        cx.drawImage(img, 0, 0, w, h);
        out = cv.toDataURL('image/jpeg', quality);
      }catch(e){ /* 跨域或画布不可用时直接用原图 */ }
      cb(null, out, w, h);
    };
    img.onerror = () => cb('这张图片读不出来，换一张试试');
    img.src = fr.result;
  };
  fr.onerror = () => cb('读取文件失败');
  fr.readAsDataURL(file);
}
/* 背景图：最长边 1920、画质 0.82（铺满全屏，需要更多细节） */
function readImageFile(file){
  compressImage(file, 1920, 0.82, (err, out, w, h) => {
    if(err) return toast(err);
    BG.src = out;
    if(BG.opacity > 0.92) BG.opacity = 0.72;
    const ok = applyBg();
    toast(ok ? ('已把这张图设为背景（' + w + '×' + h + '）')
             : (lsOk ? '图片没存下来，换张小一点的图试试'
                     : '已设为背景（本浏览器的本地存储被禁用，关掉页面就没了）'));
    if(document.getElementById('bgPanel')) bgPanelRefresh();
  });
}

/* =========================================================
   卡片内的图片（一张卡可以放多张）
   单张按最长边 1280 / 画质 0.8 压缩（约 100~250KB），localStorage 通常只有 ~5MB。
   所以同一个节点上的图越多，新加的这张就压得越狠（见 nodeImgBudget）：
   宁可缩到 900px 也让人把 5、6 张并排的图放在一张卡上，而不是被迫拆成好几个分支。
   写不进去依然回滚，并说清楚是存储满了。
   ========================================================= */
const NODE_IMG_MAX = 1280, NODE_IMG_Q = 0.8;
function nodeImgBudget(count){
  if(count < 1) return { edge: NODE_IMG_MAX, q: NODE_IMG_Q };
  if(count < 3) return { edge: 1100, q: 0.74 };
  return { edge: 900, q: 0.68 };
}
/* 读一律走这里：新数据看 imgs 数组，旧数据（单个 img 字符串）自动当成「只有一张」。
   只认自己压出来的 dataURL——导入的 JSON 里万一塞了别的东西，也不至于被当成标签解析。 */
function nodeImgs(n){
  const raw = n ? (Array.isArray(n.imgs) ? n.imgs : (n.img ? [n.img] : [])) : [];
  return raw.filter(u => typeof u === 'string' && /^data:image\//.test(u));
}
function imgCount(n){ return nodeImgs(n).length; }
/* 整体替换这个节点的图片（写入 + 配额回滚）。
   写成功后顺手把旧的 img 字段清掉，数据不会两边各留一份。 */
function setNodeImages(id, arr){
  const n = byId(id); if(!n) return false;
  const keepImgs = n.imgs, keepImg = n.img;
  n.imgs = (arr || []).filter(u => typeof u === 'string' && /^data:image\//.test(u));
  if(n.img) n.img = '';
  if(!lsOk) return true;               /* 隐私模式：图留在本次会话，刷新即失效 */
  if(!lsSet(KEY, JSON.stringify(store))){
    n.imgs = keepImgs; n.img = keepImg;
    toast('存不下了：本机存储约 5MB 已满，先删掉几张卡片图片再试');
    return false;
  }
  return true;
}
function addNodeImages(id, datas){
  const n = byId(id); if(!n) return false;
  const add = (datas || []).filter(u => typeof u === 'string' && /^data:image\//.test(u));
  if(!add.length) return false;
  return setNodeImages(id, nodeImgs(n).concat(add));
}
function removeNodeImage(id, idx){
  const n = byId(id); if(!n) return false;
  const cur = nodeImgs(n);
  if(idx < 0 || idx >= cur.length) return false;
  cur.splice(idx, 1);
  return setNodeImages(id, cur);
}
/* 把一批文件读进来加到卡片上。逐张写入（每张单独落盘），
   中途存储满了前面的还在，不会「全军覆没」。 */
function ingestImages(id, files){
  const n = byId(id); if(!n) return;
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type || ''));
  if(!list.length) return toast('请选择图片文件（jpg / png / webp 都行）');
  const b = nodeImgBudget(imgCount(n));
  const out = [];
  let i = 0, fail = 0;
  const step = () => {
    if(i >= list.length){
      if(!out.length) return toast(fail ? '这些图片都读不出来，换几张试试' : '没有可用的图片');
      let added = 0;
      for(let k = 0; k < out.length; k++){ if(addNodeImages(id, [out[k]])) added++; else break; }
      if(!added) return;
      pushHist();
      refreshNodeCard(id);
      toast(added > 1 ? ('已加 ' + added + ' 张，这张卡片现在有 ' + imgCount(byId(id)) + ' 张图片')
                      : (fail ? '有 ' + fail + ' 张读不出来，其余已加上' : '图片已加到卡片'));
      return;
    }
    const f = list[i++];
    compressImage(f, b.edge, b.q, (err, dataUrl) => {
      if(err) fail++; else out.push(dataUrl);
      step();
    });
  };
  step();
}
/* 点「加图片」→ 选文件（可多选）→ 压缩 → 追加到节点 */
function pickNodeImage(id){
  const inp = document.getElementById('nodeImgPick');
  if(!inp) return;
  inp.value = '';
  inp.multiple = true;
  inp.onchange = () => {
    const fs = Array.from(inp.files || []);
    inp.onchange = null;
    if(fs.length) ingestImages(id, fs);
  };
  inp.click();
}
function clearNodeImage(id, idx){
  const n = byId(id); if(!n) return;
  if(!nodeImgs(n).length) return;
  if(!removeNodeImage(id, idx)) return;
  pushHist();
  refreshNodeCard(id);
  toast('已删除这张图片');
}
/* 同一张卡片可能同时出现在画布和右侧面板上，改完图片两边都要刷 */
function refreshNodeCard(id){
  if(editId === id) renderNodes(); else patchCard(id);
  if(inspOpen && selId === id && document.getElementById('inspector')) renderInspector();
  /* 重渲染会把输入框整个换掉、焦点掉回 body，键盘就此失灵；
     还在编辑这张卡就把焦点还给标题框。 */
  if(editId === id){

}
/* 大图预览：一张卡有多张时可以左右翻 */
let lbList = [], lbAt = 0, lbCap = '';
function lbDraw(){
  const lb = document.getElementById('lightbox'); if(!lb) return;

    + '<div class="lb-cap">' + lbCap + '</div>'

function lbStep(d){

function openImage(id, idx){

let store = { version:1, projectName:'我的每日记录', days:{} };
let curDate = fmtDate(new Date());
let selId = null;
let hoverId = null;           /* 鼠标当前悬停的卡片：它的连线会亮起来 */
let zoom = 1, panX = 0, panY = 0;
let LAY = {}, HEIGHTS = {}, ANCHOR = {};
/* 整理动画播放时，卡片 / 连线的临时坐标写在这儿（优先级高于 x/y 与 LAY），
   这样每帧走一遍 applyPos + drawEdges，卡片和线永远是同步的 */
let ARR_POS = {};
let arrangeRAF = 0, quietView = false;

/* ---------- 基础工具 ---------- */
function fmtDate(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function uid(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function day(){
  if(!store.days[curDate]) store.days[curDate] = { nodes:[], nextSeq:1 };
  const d = store.days[curDate];
  if(!Array.isArray(d.nodes)) d.nodes = [];
  if(!d.nextSeq) d.nextSeq = d.nodes.length + 1;
  return d;
}
/* 存储读写统一走这两个函数：隐私模式 / 存储被禁时任何一次访问都会抛异常，
   散落的 localStorage 调用很容易漏掉一处就把整页搞崩 */
let lsOk = true;   /* 存储能不能用；隐私模式下会被翻成 false */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ lsOk = false; return null; } }
function lsSet(k, v){
  try{ localStorage.setItem(k, v); lsOk = true; return true; }
  catch(e){
    /* 「写满了」和「根本不让用」是两回事：写满时存储本身是可用的，
       后面还能删东西腾地方，不能把 lsOk 翻掉。 */
    const quota = e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
                        || e.code === 22 || e.code === 1014);
    if(!quota) lsOk = false;
    return false;
  }
}
function save(){
  if(!lsSet(KEY, JSON.stringify(store))) toast('保存失败：浏览器存储空间不足或被禁用');
}
function load(){
  try{
    const raw = lsGet(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && o.days){
        store = o;
        if(!store.projectName) store.projectName = '我的每日记录';
        Object.keys(store.days).forEach(k => { if(!Array.isArray(store.days[k].nodes)) store.days[k].nodes = []; });
      }
    }
  }catch(e){ console.warn('读取失败', e); }
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), 2200);
}
function toMin(hm){
  if(!hm || !/^\d{1,2}:\d{2}$/.test(hm)) return null;
  const [h,m] = hm.split(':').map(Number);
  return h*60+m;
}
function durMin(n){
  const a = toMin(n.start), b = toMin(n.end);
  if(a==null || b==null) return null;
  let d = b - a;
  if(d < 0) d += 1440;
  return d;
}
function fmtDur(m){
  if(m==null) return '未填时长';
  if(m < 60) return m + ' 分钟';
  const h = Math.floor(m/60), r = m%60;
  return r ? h+' 小时 '+r+' 分' : h+' 小时';
}
function trunc(s, n){ s = String(s||''); return s.length > n ? s.slice(0,n)+'…' : s; }
function weekName(ds){
  const d = new Date(ds+'T00:00:00');
  return '周' + '日一二三四五六'[d.getDay()];
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* ---------- 树操作 ---------- */
function childrenOf(pid, nodes){
  nodes = nodes || day().nodes;
  return nodes.filter(n => n.parentId === pid);
}
function byId(id){
  return day().nodes.find(n => n.id === id) || null;
}
function pathOf(id){
  const p = []; let cur = byId(id); const guard = new Set();
  while(cur && !guard.has(cur.id)){ guard.add(cur.id); p.unshift(cur); cur = byId(cur.parentId); }
  return p;
}
function descendantsOf(id, nodes){
  nodes = nodes || day().nodes;
  const out = [];
  const walk = pid => nodes.filter(n=>n.parentId===pid).forEach(n=>{ out.push(n); walk(n.id); });
  walk(id);
  return out;
}
/* 某分支自身 + 全部子分支的总时长（重叠按并集算） */
function branchMinutes(id){
  const all = [byId(id), ...descendantsOf(id)].filter(Boolean);
  const spans = [];
  all.forEach(n => {
    const a = toMin(n.start), b = toMin(n.end);
    if(a!=null && b!=null){ let bb = b; if(bb < a) bb += 1440; spans.push([a,bb]); }
  });
  if(!spans.length) return null;
  spans.sort((x,y)=>x[0]-y[0]);
  let total = 0, cs = spans[0][0], ce = spans[0][1];
  for(let i=1;i<spans.length;i++){
    if(spans[i][0] <= ce) ce = Math.max(ce, spans[i][1]);
    else { total += ce-cs; cs = spans[i][0]; ce = spans[i][1]; }
  }
  total += ce - cs;
  return total;
}
/* 同级顺序稳定：有开始时间按时间升序，无时间的保持创建先后 */
function sortSibs(arr){
  return arr.slice().sort((a,b) => {
    const x = toMin(a.start), y = toMin(b.start);
    if(x == null && y == null) return 0;
    if(x == null) return 1;
    if(y == null) return -1;
    return x - y;
  });
}
function isHidden(n){
  let cur = n; const guard = new Set();
  while(cur && cur.parentId){
    if(guard.has(cur.parentId)) break;
    guard.add(cur.parentId);
    const p = byId(cur.parentId);
    if(!p) break;
    if(p.collapsed) return true;
    cur = p;
  }
  return false;
}
function visChildren(pid){ return sortSibs(childrenOf(pid).filter(n => !isHidden(n))); }
function visNodes(){
  const out = [];
  const walk = pid => visChildren(pid).forEach(n => { out.push(n); walk(n.id); });
  walk(null);
  return out;
}
function flattenVis(){
  const out = [];
  const walk = pid => visChildren(pid).forEach(n => { out.push(n); if(!n.collapsed) walk(n.id); });
  walk(null);
  return out;
}
function addNode(pid, title, start){
  const d = day();
  const seq = d.nextSeq++;
  const n = {
    id: uid(), parentId: pid || null,
    title: title || ('分支 ' + seq),
    start: start || nowHM(), end: '',
    status: '专注', rating: 0, note: '', collapsed: false,
    imgs: [],                    /* 节点内图片（压缩后的 dataURL 数组，一张卡可以放多张） */
    x: null, y: null
  };
  d.nodes.push(n);
  if(pid){
    const p = byId(pid); if(p) p.collapsed = false;
    const pIdx = d.nodes.findIndex(x => x.id === pid);
    const sibsAfter = d.nodes.slice(pIdx+1).filter(x => x.parentId === pid);
    if(sibsAfter.length){
      const anchor = sibsAfter[sibsAfter.length-1];
      const at = d.nodes.indexOf(anchor);
      const [moved] = d.nodes.splice(d.nodes.length-1, 1);
      d.nodes.splice(at+1, 0, moved);
    }
  }
  save();
  return n;
}
function delNode(id){
  const kill = new Set([id, ...descendantsOf(id).map(n=>n.id)]);
  day().nodes = day().nodes.filter(n => !kill.has(n.id));
  save();
}
function moveNode(id, newPid){
  if(newPid){
    if(newPid === id) return false;
    if(descendantsOf(id).some(n => n.id === newPid)) return false;
  }
  const n = byId(id); if(!n) return false;
  n.parentId = newPid || null;
  n.x = null; n.y = null;
  save(); return true;
}
let dupImgDropped = false;   /* 这次复制有没有为了省存储丢掉图片 */
function dupBranch(id){
  const src = byId(id); if(!src) return null;
  dupImgDropped = false;
  const cloneOne = (n, pid) => {
    const c = JSON.parse(JSON.stringify(n));
    c.id = uid(); c.parentId = pid; c.x = null; c.y = null;
    /* 图片按最长边 1280 存，一份就 100KB+；副本带图很容易把 5MB 的存储撑爆，
       所以复制只带结构。真需要图，重新拖一张进来就行。 */
    if(c.img || (Array.isArray(c.imgs) && c.imgs.length)){ c.img = ''; c.imgs = []; dupImgDropped = true; }
    day().nodes.push(c);
    childrenOf(n.id).forEach(k => cloneOne(k, c.id));
    return c;
  };
  const root = cloneOne(src, src.parentId);
  root.title = src.title + ' 副本';
  save();
  return root;
}
/* 复制分支后统一的收尾：三个入口（卡片按钮 / 右键菜单 / 详情面板）共用 */
function dupDone(dup){
  if(!dup) return;
  pushHist(); render(); selectNode(dup.id, {center:true});
  toast(dupImgDropped ? '已复制分支（图片没跟着复制，省点存储空间）' : '已复制分支');
}

/* ---------- 撤销 / 重做 ---------- */
function pushHist(){
  const snap = JSON.stringify(store);
  if(hist[hIdx] === snap) return;
  hist = hist.slice(0, hIdx + 1);
  hist.push(snap);
  if(hist.length > 80){ hist.shift(); }
  hIdx = hist.length - 1;

}
function syncHistBtns(){
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if(u) u.disabled = hIdx <= 0;
  if(r) r.disabled = hIdx >= hist.length - 1;
}
function undo(){
  if(hIdx <= 0) return toast('没有可撤销的操作');
  hIdx--; store = JSON.parse(hist[hIdx]);
  save(); selId = byId(selId) ? selId : null;
  render();

function redo(){

/* =========================================================
   画布布局
   ========================================================= */
function measure(){
  HEIGHTS = {}; ANCHOR = {};
  document.querySelectorAll('#nodes .nd').forEach(el => {
    const id = el.dataset.id;
    HEIGHTS[id] = el.offsetHeight;
    const card = el.querySelector('.nd-card');
    /* 连线端点对准卡片本体中线（不含上方的小标题行） */
    ANCHOR[id] = card ? card.offsetTop + card.offsetHeight/2 : el.offsetHeight/2;
  });
}
function anchorY(id){ return ANCHOR[id] != null ? ANCHOR[id] : (HEIGHTS[id]||100)/2; }
function layout(){
  LAY = {};
  const roots = visChildren(null);
  if(!roots.length) return;
  const sub = {};
  const subH = n => {
    const kids = visChildren(n.id);
    if(!kids.length){ sub[n.id] = HEIGHTS[n.id] || 100; return sub[n.id]; }
    let s = 0;
    kids.forEach((k,i) => { s += subH(k); if(i) s += GAPY; });
    sub[n.id] = Math.max(HEIGHTS[n.id] || 100, s);
    return sub[n.id];
  };
  roots.forEach(subH);
  const blockH = kids => kids.reduce((a,k,i) => a + sub[k.id] + (i ? GAPY : 0), 0);
  const place = (n, depth, top) => {
    const kids = visChildren(n.id);
    const x = PADX + depth * (NW + GAPX);
    if(!kids.length){
      LAY[n.id] = { x, y: top + (sub[n.id] - (HEIGHTS[n.id]||100)) / 2 };
      return;
    }
    let cursor = top + (sub[n.id] - blockH(kids)) / 2;
    kids.forEach(k => { place(k, depth+1, cursor); cursor += sub[k.id] + GAPY; });
    const first = LAY[kids[0].id], last = LAY[kids[kids.length-1].id];
    const y1 = first.y + (HEIGHTS[kids[0].id]||100)/2;
    const y2 = last.y + (HEIGHTS[kids[kids.length-1].id]||100)/2;
    LAY[n.id] = { x, y: (y1 + y2)/2 - (HEIGHTS[n.id]||100)/2 };
  };
  let y = PADY;
  roots.forEach(r => { place(r, 0, y); y += sub[r.id] + ROOTGAP; });
}
function nodePos(n){
  if(n.x != null && n.y != null) return { x:n.x, y:n.y };
  return LAY[n.id] || { x:PADX, y:PADY };
}
function nodeEl(id){ return document.querySelector('#nodes .nd[data-id="'+id+'"]'); }
function applyPos(){
  visNodes().forEach(n => {
    const el = nodeEl(n.id); if(!el) return;
    const p = nodePos(n);
    el.style.transform = 'translate(' + Math.round(p.x) + 'px,' + Math.round(p.y) + 'px)';
  });
}
/* 一条边的贝塞尔路径：父节点右侧中点 → 子节点左侧中点 */
function edgeD(x1, y1, x2, y2){
  const dx = Math.max(26, (x2 - x1) * 0.46);
  return 'M'+x1.toFixed(1)+','+y1.toFixed(1)+' C'+(x1+dx).toFixed(1)+','+y1.toFixed(1)
       + ' '+(x2-dx).toFixed(1)+','+y2.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1);
}
function collectEdges(){
  const out = [];
  visNodes().forEach(n => {
    const p = nodePos(n);
    visChildren(n.id).forEach(k => {
      const q = nodePos(k);
      out.push({ pid: n.id, cid: k.id,
        d: edgeD(p.x + NW, p.y + anchorY(n.id), q.x, q.y + anchorY(k.id)) });
    });
  });
  return out;
}
/* 与 #edgeG 子元素一一对应的几何缓存，用来跳过没变化的 path */
let EDGE_D = [], EDGE_SIG = '', EDGE_RICH = true;
/* 光弹的起始相位：用黄金比错开。整屏同时出发会显得很机械，
   固定步长又会看出「每隔几条就重复」的规律，黄金比既打散又不扎堆。 */
function flowPhase(i){
  return (((i * 0.6180339887) % 1) * 1.6).toFixed(2);
}
function drawEdges(){
  const g = document.getElementById('edgeG');
  const list = collectEdges();
  /* 边多的时候省掉光晕 / 柔光两层：四层×几百条会拖慢拖拽 */
  const rich = list.length <= 80;
  /* EDGE_SKIN 参与签名：换主题 / 配色变了要重建，否则连线颜色会留在旧主题上 */
  const sig = EDGE_SKIN + (rich ? 'H' : 'h') + '|' + list.map(e => e.pid + '>' + e.cid).join(',');
  if(sig !== EDGE_SIG){
    EDGE_SIG = sig; EDGE_D = [];
    /* hiflow：边不多，可以让光弹发光（见 CSS） */
    g.classList.toggle('hiflow', rich);
    g.innerHTML = list.map((e, i) =>
      /* 每条线取「子节点所属分支」的色相。两个变量写在元素上，
         CSS 里的 currentColor 依次解析，于是「通电」是在同色相里变亮，
         而不是所有线都退回同一个蓝色（那样归属就又看不出来了）。 */
      '<g class="e" data-pid="'+e.pid+'" data-cid="'+e.cid+'"'
        + ' style="--edge-flow:'+branchColor(e.cid)+';--edge-flow-hot:'+branchColorHot(e.cid)+'">'
        + '<path class="e-base" vector-effect="non-scaling-stroke" d="'+e.d+'"/>'
        + (rich ? '<path class="e-halo" vector-effect="non-scaling-stroke" d="'+e.d+'"/>' : '')
        + (rich ? '<path class="e-glow" vector-effect="non-scaling-stroke" pathLength="100" d="'+e.d
            + '" style="animation-delay:-'+flowPhase(i)+'s"/>' : '')
        /* pathLength=100：把每条线都归一化到同一套刻度，于是一条线上只跑一颗光弹 */
        + '<path class="e-flow" vector-effect="non-scaling-stroke" pathLength="100" d="'+e.d
        + '" style="animation-delay:-'+flowPhase(i)+'s"/>'
      + '</g>').join('');
    syncEdgeHot();
    return;
  }
  /* 结构没变时只更新 d —— 每帧重设 innerHTML 会让 CSS 动画从头播，电流就「僵」住了 */
  const gs = g.children;
  for(let i = 0; i < list.length; i++){
    const d = list[i].d;
    if(EDGE_D[i] === d) continue;
    EDGE_D[i] = d;
    const el = gs[i]; if(!el) continue;
    const kids = el.children;
    for(let j = 0; j < kids.length; j++) kids[j].setAttribute('d', d);
  }
}
/* 与哪张卡片相连的线通电：鼠标扫过的优先，其次是选中的那张 */
function syncEdgeHot(){
  const g = document.getElementById('edgeG'); if(!g) return;
  const hot = hoverId || selId;
  const es = g.children;
  for(let i = 0; i < es.length; i++){
    const el = es[i];
    const on = !!hot && (el.getAttribute('data-pid') === hot || el.getAttribute('data-cid') === hot);
    if(el.classList.contains('on') !== on) el.classList.toggle('on', on);
  }
}

/* 屏幕坐标 → 画布世界坐标 */
function s2w(x, y){ return { x: (x-panX)/zoom, y: (y-panY)/zoom }; }
let stageIdleT = 0, stageMoving = false;
/* 停手后撤掉合成层，让浏览器按最终比例重新栅格化文字（关键：否则一直用旧位图拉伸→发虚） */
function hushStage(){
  stageMoving = false;
  const st = document.getElementById('stage');
  if(st) st.classList.remove('moving');
}
/* 缩得很小时电流已经看不清，却仍要每帧重绘上百条 path —— 直接停掉 */
let flowPaused = null;
function syncEdgeFlow(){
  const g = document.getElementById('edgeG'); if(!g) return;
  const pause = zoom < 0.3;
  if(pause !== flowPaused){ flowPaused = pause; g.classList.toggle('paused', pause); }
}
function applyTransform(){
  const st = document.getElementById('stage');
  /* 平移吸附到整数设备像素：半像素偏移会让文字边缘发灰 */
  const dpr = Math.round(window.devicePixelRatio || 1) || 1;
  const tx = Math.round(panX * dpr) / dpr;
  const ty = Math.round(panY * dpr) / dpr;
  st.style.transform =
    'translate(' + tx + 'px,' + ty + 'px) scale(' + zoom.toFixed(4) + ')';
  /* --inv = 1/zoom：浮动工具条靠它反向缩放，屏幕尺寸才恒定（见 CSS .nd-tools） */
  st.style.setProperty('--inv', (1 / zoom).toFixed(4));
  if(!stageMoving){ st.classList.add('moving'); stageMoving = true; }
  clearTimeout(stageIdleT);
  stageIdleT = setTimeout(hushStage, 160);
  syncZoomLabel(); syncEdgeFlow();
  /* 整理动画里每帧都会走到这儿，小地图没必要跟着每帧重画 */
  if(!quietView){ drawMinimap(); syncTools(); syncKidHint(); }
}
function syncZoomLabel(){
  const el = document.getElementById('zoomLabel');
  if(el) el.textContent = Math.round(zoom * 100) + '%';
}
function setZoom(z, cx, cy){
  stopArrange(true);   /* 用户开始缩放 = 整理动画立刻让位，别跟人抢镜头 */
  /* 收敛到 0.1% 精度：避免 0.7523 这类脏比例让文字栅格化发虚 */
  const nz = clamp(Math.round(z * 1000) / 1000, MIN_Z, MAX_Z);
  const cw = innerWidth, ch = innerHeight;
  const px = cx == null ? cw/2 : cx, py = cy == null ? ch/2 : cy;
  const w = s2w(px, py);
  zoom = nz;
  panX = px - w.x * zoom;
  panY = py - w.y * zoom;
  applyTransform();
}
function boundsOf(){
  const vis = visNodes();
  if(!vis.length) return null;
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  vis.forEach(n => {
    const p = nodePos(n);
    const h = HEIGHTS[n.id] || 100;
    x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
    x2 = Math.max(x2, p.x + NW); y2 = Math.max(y2, p.y + h);
  });
  return { x1, y1, x2, y2, w: x2-x1, h: y2-y1 };
}
/* 可读下限：卡片正文 12.5px，缩到 50% 以下中文就糊成一团了。
   「适应视图」也不再无限缩——真要总览，用户自己按 − 或滚轮更合适。 */
const READ_Z = 0.5;
function viewBox(){
  const top = 62, bottom = 74;
  /* 大纲打开时左侧多占 300px，取景必须把这块让出来，否则卡片会躲到面板后面 */
  const left = isNarrow() ? 54 : (olOpen ? 342 : 74);
  const right = (inspOpen && !isNarrow()) ? 372 : 20;
  return { top, bottom, left, right,
    availW: Math.max(160, innerWidth - left - right),
    availH: Math.max(120, innerHeight - top - bottom) };
}
function fitZoomOf(b){
  if(!b) return 1;
  const v = viewBox();
  let z = Math.min(v.availW / (b.w + 80), v.availH / (b.h + 80));
  z = clamp(z, MIN_Z, 1.1);
  /* 干净比例：0.75 比 0.7483 栅格化得更清楚 */
  return Math.max(MIN_Z, Math.round(z * 200) / 200);
}
/* 「适应视图」的目标 zoom / pan。只算不落地——
   自动整理要在动画里把它当终点，所以计算和赋值拆开。 */
function fitBox(forceMin, floor){
  const b = boundsOf();
  if(!b) return { zoom:1, panX:40, panY:90 };
  const v = viewBox();
  let z = fitZoomOf(b);
  if(forceMin) z = Math.max(z, forceMin);
  const fl = (floor == null ? READ_Z : floor);
  if(z < fl) z = fl;
  z = Math.min(MAX_Z, Math.round(z * 1000) / 1000);
  return { zoom: z,
    panX: v.left + (v.availW - b.w*z)/2 - b.x1*z,
    panY: v.top + (v.availH - b.h*z)/2 - b.y1*z };
}
function fitView(forceMin, floor){
  const t = fitBox(forceMin, floor);
  zoom = t.zoom; panX = t.panX; panY = t.panY;
  applyTransform();
}

/* =========================================================
   自动整理布局
   把手工拖散的分支收回树形布局。刻意不做「瞬间归位」：
   位置逐帧插值 → 卡片飞过去、连线每帧重画、视图同步拉远，
   看起来是整棵树一起归位，而不是一次生硬的跳变。
   ========================================================= */
const ARRANGE_MS = 560;
function prefersReduced(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
/* settle=true：把卡片落到当前该在的位置（用户开始拖 / 缩放，动画要立刻让位） */
function stopArrange(settle){
  if(!arrangeRAF) return;
  cancelAnimationFrame(arrangeRAF);
  arrangeRAF = 0; quietView = false;
  if(settle){ ARR_POS = {}; applyPos(); drawEdges(); drawMinimap(); }
}
function playArrange(from, to, v0, v1){
  const ids = Object.keys(to).filter(id => from[id]);
  const t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);   /* 起步快、收尾稳 */
  quietView = true;                            /* 动画期间不重画小地图 */
  const step = now => {
    const p = Math.min(1, (now - t0) / ARRANGE_MS), e = ease(p);
    ids.forEach(id => {
      const a = from[id], b = to[id];
      ARR_POS[id] = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e };
    });
    zoom = v0.zoom + (v1.zoom - v0.zoom) * e;
    panX = v0.panX + (v1.panX - v0.panX) * e;
    panY = v0.panY + (v1.panY - v0.panY) * e;
    applyPos(); drawEdges(); applyTransform();
    if(p < 1){ arrangeRAF = requestAnimationFrame(step); return; }
    arrangeRAF = 0; quietView = false; ARR_POS = {};
    zoom = v1.zoom; panX = v1.panX; panY = v1.panY;
    applyPos(); drawEdges(); applyTransform();
  };
  arrangeRAF = requestAnimationFrame(step);
}
/* 两种力度对应两种意图：
   soft（默认）—— 只把互相压住的卡片推开，大体位置不动（最小位移）。
                  手工摆过「今天想重点看的放正中间」的人，随手按一下不会被抹掉。
   full         —— 清掉所有手工位置、整棵树回到自动树形布局（原来那套）。
   Heptabase 把这两件事拆成 Card Space-out 和 Tidy Up 是有道理的：
   只有前者才敢随手按。 */
function autoArrange(mode){
  const ns = day().nodes;
  if(!ns.length){ toast('这一天还没有节点'); return; }
  measure();                       /* spaceOut 要用 HEIGHTS，先量一遍 */
  const full = mode === 'full';
  /* 起点 = 卡片此刻在屏幕上的位置（上一次动画没播完也能接着飞） */
  const from = {};
  visNodes().forEach(n => { const p = nodePos(n); from[n.id] = { x:p.x, y:p.y }; });
  stopArrange(false);
  ARR_POS = {};

  const to = {};
  let label = '';
  if(full){
    const moved = ns.filter(n => n.x != null || n.y != null).length;
    ns.forEach(n => { n.x = null; n.y = null; });
    pushHist(); save();
    measure(); layout();
    visNodes().forEach(n => { const p = nodePos(n); to[n.id] = { x:p.x, y:p.y }; });
    label = moved ? ('已彻底重排 ' + moved + ' 个手工摆放的节点') : '已按层级排齐';
  } else {
    const moved = spaceOut(from);
    if(!moved){ toast('没有互相压住的卡片，布局不用动'); return; }
    pushHist(); save();
    visNodes().forEach(n => { const p = nodePos(n); to[n.id] = { x:p.x, y:p.y }; });
    label = '只推开了重叠的 ' + moved + ' 张卡片（你手工摆的位置保留着）';
  }

  const v0 = { zoom, panX, panY };
  /* 彻底重排用「打开某一天」那套取景；温和整理不动镜头，只在有卡片被挤出视口时轻微退一点 */
  const v1 = full ? openBox() : keepBox();
  if(prefersReduced()){
    zoom = v1.zoom; panX = v1.panX; panY = v1.panY;
    applyPos(); drawEdges(); applyTransform();
  } else {
    playArrange(from, to, v0, v1);
  }
  toast(label);
}
/* 温和整理用的取景：尽量保持现在的视角，只在有卡片被推出视口时把它拉回来 */
function keepBox(){
  const b = boundsOf();
  if(!b) return { zoom, panX, panY };
  const v = viewBox();
  const l = v.left + 24, t = v.top + 24;
  const r = innerWidth - v.right - 24, bo = innerHeight - v.bottom - 24;
  let px = panX, py = panY;
  if(b.x1*zoom + px < l) px = l - b.x1*zoom;
  if(b.y1*zoom + py < t) py = t - b.y1*zoom;
  if(b.x2*zoom + px > r) px = Math.min(px, r - b.x2*zoom);
  if(b.y2*zoom + py > bo) py = Math.min(py, bo - b.y2*zoom);
  return { zoom, panX: px, panY: py };
}
/* 只解决重叠：迭代若干轮，把互相压住的卡片沿「重叠较小的那个方向」推开。
   结果写回 n.x / n.y，于是它们变成手工位置，下次彻底重排之前都不会被动。 */
function spaceOut(from){
  const ids = Object.keys(from);
  if(ids.length < 2) return 0;
  const GX = 26, GY = 18;    /* 推开后至少留出的缝 */
  const box = {};
  ids.forEach(id => {
    const h = HEIGHTS[id] || 100;
    box[id] = { x: from[id].x, y: from[id].y, w: NW, h };
  });
  const hitSet = new Set();
  for(let round = 0; round < 24; round++){
    let hit = false;
    for(let i = 0; i < ids.length; i++){
      for(let j = i + 1; j < ids.length; j++){
        const a = box[ids[i]], c = box[ids[j]];
        const ox = Math.min(a.x + a.w, c.x + c.w) - Math.max(a.x, c.x);
        const oy = Math.min(a.y + a.h, c.y + c.h) - Math.max(a.y, c.y);
        if(ox <= -GX || oy <= -GY) continue;   /* 已经隔开了 */
        hit = true;
        hitSet.add(ids[i]); hitSet.add(ids[j]);
        if(ox < oy){
          const push = (ox + GX) / 2 + 1;
          if(a.x + a.w/2 <= c.x + c.w/2){ a.x -= push; c.x += push; }
          else { a.x += push; c.x -= push; }
        } else {
          const push = (oy + GY) / 2 + 1;
          if(a.y + a.h/2 <= c.y + c.h/2){ a.y -= push; c.y += push; }
          else { a.y += push; c.y -= push; }
        }
      }
    }
    if(!hit) break;
  }
  if(!hitSet.size) return 0;
  hitSet.forEach(id => {
    const n = byId(id); if(!n) return;
    n.x = Math.round(clamp(box[id].x, -POS_LIMIT, POS_LIMIT));
    n.y = Math.round(clamp(box[id].y, -POS_LIMIT, POS_LIMIT));
  });
  return hitSet.size;
}
/* 打开某一天时的取景。
   旧逻辑是一律「整棵树塞进一屏」，一天记满了就会缩到 ~40%，文字小到看不清。
   现在：一屏放得下就整体适应；放不下就停在 100% 从树的开头看，文字始终清楚。 */
function openBox(){
  const b = boundsOf();
  if(!b) return { zoom:1, panX:40, panY:90 };
  if(isNarrow()) return fitBox(0.4, 0.4);
  if(fitZoomOf(b) >= 0.92) return fitBox();
  const v = viewBox();
  return { zoom: 1, panX: v.left + 10 - b.x1, panY: v.top + 10 - b.y1 };
}
function openView(){
  const t = openBox();
  zoom = t.zoom; panX = t.panX; panY = t.panY;
  applyTransform();
}
function isNarrow(){ return innerWidth <= 900; }

/* ---------- 小地图 ---------- */
/* 小地图：缩略块沿用分支配色，于是它本身就是一张「今天重心在哪」的色块图；
   选中某张时同支保持常亮、其他支淡出，缩到 40% 以下自动让位。 */
function drawMinimap(){
  const body = document.getElementById('mmBody');
  if(!body) return;
  const box = document.getElementById('minimap');
  const tooSmall = zoom < 0.4;   /* 这时整棵树本来就在屏幕里，小地图只占地方 */
  box.style.display = (mmOpen && !tooSmall) ? '' : 'none';
  if(mmOpen && tooSmall) return;
  const bw = body.clientWidth || 152, bh = body.clientHeight || 104;
  const b = boundsOf();
  if(!b){ body.innerHTML = ''; return; }
  const pad = 40;
  const sx = bw / (b.w + pad*2), sy = bh / (b.h + pad*2);
  const s = Math.min(sx, sy);
  const ox = (bw - b.w*s)/2 - (b.x1 - pad)*s;
  const oy = (bh - b.h*s)/2 - (b.y1 - pad)*s;
  const selRoot = selId ? rootIdOf(selId) : null;
  let html = '';
  visNodes().forEach(n => {
    const p = nodePos(n);
    const h = HEIGHTS[n.id] || 100;
    const same = !selRoot || rootIdOf(n.id) === selRoot;
    html += '<span class="mm-node'+(n.id===selId?' sel':'')+'" title="' + esc(n.title) + '"'
          + ' style="left:'+(p.x*s+ox).toFixed(1)+'px;top:'+(p.y*s+oy).toFixed(1)
          + 'px;width:'+Math.max(3,NW*s).toFixed(1)+'px;height:'+Math.max(2,h*s).toFixed(1)
          + 'px;background:'+branchColor(n.id)
          + (same ? '' : ';opacity:.26')
          + (n.id===selId ? ';outline:1.5px solid var(--blue);outline-offset:.5px' : '')
          + '"></span>';
  });
  const tl = s2w(0, 0), br = s2w(innerWidth, innerHeight);
  html += '<span class="mm-view" style="left:'+(tl.x*s+ox).toFixed(1)+'px;top:'+(tl.y*s+oy).toFixed(1)
        + 'px;width:'+((br.x-tl.x)*s).toFixed(1)+'px;height:'+((br.y-tl.y)*s).toFixed(1)+'px"></span>';
  body.innerHTML = html;
}

/* 浏览态的图片网格：1 张全宽、2 张两列、3 张一行、4 张 2×2、5 张以上九宫格。
   超过 9 张就只铺 9 格，最后一格盖「＋N」，点开照样能一张张翻。
   每格高度是定值 → 卡片高度不随图片加载变化，measure() 量出来就是最终值。 */
function photoGrid(n){
  const list = nodeImgs(n), cnt = list.length;
  if(!cnt) return '';
  const cols = cnt === 1 ? 1 : cnt === 2 ? 2 : cnt === 3 ? 3 : cnt === 4 ? 2 : 3;

  const show = Math.min(cnt, 9);

      + '<div class="nd-stars">' + stars + '<b data-a="ratetxt" data-id="' + n.id + '">' + (n.rating ? n.rating + '/5' : '未评分') + '</b></div>'
      + '<textarea class="nd-ti nd-ti-note" data-a="note" data-id="' + n.id + '"'
        + ' placeholder="具体做了什么？带数字最有用：做了多少、有没有产出物、卡在哪一步。">' + esc(n.note) + '</textarea>'
      + '<div class="nd-imgbox">'
        + (imgN
            ? editImgGrid(n)
              + '<div class="nd-img-bar">'
                + '<button data-a="pickimg" data-id="' + n.id + '">＋ 再加几张</button>'
                + '<button data-a="viewimg" data-id="' + n.id + '" data-i="0">看大图</button>'
              + '</div>'
            : '<button class="nd-img-add" data-a="pickimg" data-id="' + n.id + '">' + ICO.pic
              + '加图片（可多选，一张卡能放多张）</button>')
      + '</div>'
      + '<div class="nd-tip"><b>Esc</b> 或点画布空白处结束编辑</div>'
      + (n.parentId ? '<div class="nd-jack"></div>' : '')
    + '</div>';
  } else {
    /* ---- 浏览态：折叠 / 展开两态 ----
       折叠态只留「状态 + 标题 + 一行摘要」，展开态才铺开时段/评分/备注/图片。
       两态靠切类实现（CSS 的 .nd.open），高度才真的会「长」出来而不是跳一下。 */
    const bc = branchColor(n.id);
    const sub = (n.start ? (n.start + (n.end ? ' – ' + n.end : '')) : '未填时间')
              + (d != null ? ' · ' + fmtDur(d) : '');
    const one = (n.note && n.note.trim()) ? n.note.trim().split('\n')[0]
              : (imgN ? ('带 ' + imgN + ' 张图片') : (n.start ? sub : '还没填内容 · 双击卡片'));
    card = '<div class="nd-card">'
      + '<span class="nd-bar" style="background:' + bc + '"></span>'
      + '<div class="nd-tools">'
        + '<button data-a="edit" data-id="' + n.id + '" title="编辑这张卡片（也可以双击）">' + ICO.pen + '</button>'
        + '<button data-a="add" data-id="' + n.id + '" title="新建子分支">' + ICO.plus + '</button>'
        + '<button data-a="chain" data-id="' + n.id + '" title="锁定这张卡片：连续拆分模式，之后每按一次回车就加一个子分支，Esc 解锁">'
          + (chainPid === n.id ? ICO.lock : ICO.unlock) + '</button>'
        + '<button data-a="dup" data-id="' + n.id + '" title="连同子分支复制">' + ICO.dup + '</button>'
        + '<button data-a="del" data-id="' + n.id + '" title="删除">' + ICO.del + '</button>'
      + '</div>'
      + '<div class="nd-top">'
        + '<div class="nd-chip" data-a="status" data-id="' + n.id + '" title="点一下切换状态"><i style="background:' + col + '"></i><span class="nd-chip-tx">' + esc(n.status) + '</span></div>'
        + '<span class="nd-title">' + esc(n.title) + '</span>'
        + '<button class="nd-add" data-a="add" data-id="' + n.id + '">＋ 子分支</button>'
      + '</div>'
      + '<div class="nd-fold"><em>' + esc(one) + '</em>'
        + (n.rating ? '<span class="nd-fold-r">' + '★'.repeat(n.rating) + '</span>' : '')
      + '</div>'
      + '<div class="nd-body">'
        + '<div class="nd-inner">'
          + '<div class="nd-sub">' + esc(sub) + '</div>'
          + '<div class="nd-stars">' + stars + '<b>' + (n.rating ? n.rating + '/5' : '点星星打分') + '</b></div>'
          + (n.note && n.note.trim()
              ? '<div class="nd-note">' + esc(n.note) + '</div>'
              : (imgN ? '' : '<div class="nd-void">' + ICO.void + '<span>还没有内容 · 双击卡片填写</span></div>'))
          + photoGrid(n)
        + '</div>'
        + '<div class="nd-foot">' + ICO.hint + '<span>'
          + (n.note && n.note.trim() ? esc(trunc(n.note, 40))
                                     : (imgN ? ('这张卡片带了 ' + imgN + ' 张图片') : '双击编辑内容 · 拖右侧圆点拉出新分支'))
        + '</span></div>'
      + '</div>'
      + (n.parentId ? '<div class="nd-jack"></div>' : '')
      + '<div class="nd-port" data-port="' + n.id + '" title="按住往画布上拖，就能拉出一个子分支"></div>'
    + '</div>';
  }

  return '<div class="nd-head">'
      + '<span class="nd-badge" style="background:' + col + '"></span>'
      + '<span class="nd-name">' + esc(n.title) + '</span>'
      + (kids.length ? '<span class="nd-kids">' + (n.collapsed ? '▸ ' : '') + kids.length + '</span>' : '')
    + '</div>' + card;
}
/* 折叠 / 展开：当前选中的那张自动展开；也可以单独记住某张是展开的（n.open）。
   ALL_OPEN 是「全部展开」总开关——想把一整天的树讲给别人听时，一键铺开。 */
function isOpen(n){
  return !!(ALL_OPEN || n.open || n.id === selId);
}
function nodeHTML(n){
  const p = nodePos(n);
  return '<div class="nd'
      + (n.id===selId ? ' sel' : '') + (n.id===editId ? ' editing' : '')
      + (isOpen(n) ? ' open' : '') + (chainPid === n.id ? ' chained' : '')
    + '" data-id="' + n.id + '"'
    + ' style="transform:translate(' + Math.round(p.x) + 'px,' + Math.round(p.y) + 'px);--bc:' + branchColor(n.id) + '">'
    + nodeInner(n) + '</div>';

/* =========================================================
   卡片内联编辑
   ========================================================= */
function enterEdit(id, focusWhat){
  const n = byId(id); if(!n) return;
  if(editId && editId !== id && nodeEl(editId)) exitEdit(true);
  editId = id;
  selId = id;
  renderNodes();
  selectNode(id);
  const el = nodeEl(id);
  if(!el) return;
  const ti = el.querySelector('[data-a="title"]');
  const tn = el.querySelector('[data-a="note"]');

  if(target){
    target.focus();
    if(target.tagName === 'INPUT' && target.select) target.select();
  }

  toast('卡片进入编辑状态：标题、时段、状态、评分、备注都能直接改');

function exitEdit(quiet){
  if(!editId) return;

  reflow();
  if(!quiet) toast('已保存');
}
/* 编辑时同步卡片上方的小标题，避免两处文字不一致 */
function syncName(id, v){

  const nm = el.querySelector('.nd-name'); if(nm) nm.textContent = v || '未命名';

/* 点状态胶囊：循环切换（比每次都开面板快） */
function cycleStatus(n){
