/* =========================================================
   拖出一个新节点
   ========================================================= */
function addBranchAt(pid, w){
  const nn = addNode(pid && byId(pid) ? pid : null);
  if(w){
    nn.x = Math.round(clamp(w.x, -POS_LIMIT, POS_LIMIT));
    nn.y = Math.round(clamp(w.y - 36, -POS_LIMIT, POS_LIMIT));
  }
  save(); pushHist();
  selId = nn.id;
  render();
  enterEdit(nn.id, 'title');
  /* 这里**不**做揭示：w 是用户亲手指定的落点（双击的位置 / 拖拽松手的位置），
     镜头一挪，卡片就不在刚看到的那个位置了。会被挡住就自己平移一下 ——
     被动长出来的分支（＋ 子分支 / 回车）才走 revealNode。 */
  toast(pid ? '已拉出一个子分支，直接输名字' : '已拉出一个新节点，直接输名字');
  return nn;
}
/* =========================================================
   新建节点后，把它「请」进视野
   以前这里是「越界就瞬间把镜头拽过去」。画布上节点一多，每建一个子分支
   镜头就跳一次；而且「拉回来一点」并不等于看得见——底部还有底栏，
   编辑态的卡片又比浏览态高出一大截，结果就是新卡片卡在屏幕下沿外面，
   只好把它拖到左边去（树形布局因此被摆歪）。
   现在只做「让它完整可见」所需的最小位移，并带 280ms 缓动；
   底部另外多留一截，给编辑框长高腾地方。
   ========================================================= */
let panRAF = 0;
function stopPanAnim(){ if(panRAF){ cancelAnimationFrame(panRAF); panRAF = 0; } }
/* 只平移、不改比例：新建节点不该动当前这个缩放感 */
function panTo(tx, ty, ms){
  stopPanAnim();
  if(prefersReduced()){ panX = tx; panY = ty; applyTransform(); return; }
  const x0 = panX, y0 = panY, t0 = performance.now(), dur = ms || 280;
  const ease = t => 1 - Math.pow(1 - t, 3);      /* 起步快、收尾稳 */
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = ease(k);
    panX = x0 + (tx - x0) * e;
    panY = y0 + (ty - y0) * e;
    applyTransform();
    if(k < 1){ panRAF = requestAnimationFrame(step); return; }
    panRAF = 0; panX = tx; panY = ty; applyTransform();
  };
  panRAF = requestAnimationFrame(step);
}
/* h：这次要按多高来算（新建的卡片马上进编辑态，比现在量到的高）；
   padBottom：底部额外留白 */
function revealNode(id, opts){
  const n = byId(id); if(!n) return;
  const o = opts || {};
  const p = nodePos(n);
  const h = o.h || (HEIGHTS[n.id] || 100);
  const v = viewBox();
  const sx = p.x * zoom + panX, sy = p.y * zoom + panY;
  const sw = NW * zoom, sh = h * zoom;
  const padB = o.padBottom == null ? 46 : o.padBottom;
  const right = innerWidth - v.right, bottom = innerHeight - v.bottom - padB;
  let dx = 0, dy = 0;
  if(sx + sw > right) dx = right - (sx + sw);
  else if(sx < v.left) dx = v.left - sx;
  if(sy + sh > bottom) dy = bottom - (sy + sh);
  else if(sy < v.top) dy = v.top - sy;
  if(!dx && !dy) return;
  stopArrange(true);      /* 整理动画还在跑就先让它落地，别两个动画抢镜头 */
  panTo(panX + dx, panY + dy, o.ms || 280);
}
let GHOST_D = '';
function drawGhostLine(pid, to){
  const g = document.getElementById('ghostG');
  if(!g) return;
  const n = pid ? byId(pid) : null;
  if(!n || !to){ g.innerHTML = ''; GHOST_D = ''; return; }
  const p = nodePos(n);
  const d = edgeD(p.x + NW, p.y + anchorY(pid), to.x, to.y);
  if(d === GHOST_D) return;
  GHOST_D = d;
  const flow = g.querySelector('.g-flow');
  /* 拖拽中每帧重建 innerHTML 会让电流动画反复归零 → 看起来是静止的，只改 d */
  if(!flow){
    g.innerHTML = '<path class="g-halo" vector-effect="non-scaling-stroke" d="' + d + '"/>'
      + '<path class="g-glow" vector-effect="non-scaling-stroke" pathLength="100" d="' + d + '"/>'
      + '<path class="g-flow" vector-effect="non-scaling-stroke" pathLength="100" d="' + d + '"/>';
  }else{
    g.querySelector('.g-halo').setAttribute('d', d);
    g.querySelector('.g-glow').setAttribute('d', d);
    flow.setAttribute('d', d);
  }
}
/* 拖到卡片上时，新节点最终会落在哪一格？
   它就是「自动布局把新节点排成目标的某个子节点」之后的位置，
   所以这里塞一个探针节点、把布局真跑一遍来预测，而不是另写一套近似算法
   （近似算法迟早跟主布局漂移，预览框就会和实际落点对不上）。
   预览框与松手后的位置共用这个结果，才有「所见即所得」。
   注意：新节点的 start 取「现在」，而同级是按开始时间排序的，
   所以落点未必在子列末尾——探针必须带上 start 才能预测准。 */
let DROP_CACHE = { pid: null, slot: null };
function resetDropSlot(){ DROP_CACHE = { pid: null, slot: null }; }
function dropSlot(pid){
  if(!pid || !byId(pid)) return null;
  if(DROP_CACHE.pid === pid) return DROP_CACHE.slot;
  const t = byId(pid);
  const probe = {
    id: '__dropProbe__', parentId: pid, title: '', start: nowHM(), end: '',
    status: '专注', rating: 0, note: '', collapsed: false, imgs: [], x: null, y: null
  };
  const wasCollapsed = t.collapsed;
  day().nodes.push(probe);
  t.collapsed = false;                    /* addNode 会把目标展开，预测也要跟着展开 */
  const keepLay = LAY, keepH = HEIGHTS, keepA = ANCHOR;
  let slot = null;
  try {
    measure();
    HEIGHTS[probe.id] = 74;               /* 探针不在 DOM 里，给个折叠态卡片的典型高度 */
    layout();
    if(LAY[probe.id]) slot = { x: LAY[probe.id].x, y: LAY[probe.id].y };
  } finally {
    day().nodes.pop();
    t.collapsed = wasCollapsed;
    LAY = keepLay; HEIGHTS = keepH; ANCHOR = keepA;   /* 别把探针的痕迹留在布局缓存里 */
  }
  DROP_CACHE = { pid, slot };
  return slot;
}
function showDropGhost(left, top, ok){
  const g = document.getElementById('dropGhost');
  if(!g) return;
  g.classList.add('on');
  g.classList.toggle('onto', !!ok);
  g.style.transform = 'translate(' + Math.round(left) + 'px,' + Math.round(top) + 'px)';
}
function hideDropGhost(){
  const g = document.getElementById('dropGhost');
  if(g) g.classList.remove('on');
  const gg = document.getElementById('ghostG');
  if(gg) gg.innerHTML = '';
  GHOST_D = '';
  document.querySelectorAll('.nd-port.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('#nodes .nd.dropin').forEach(el => el.classList.remove('dropin'));
}
function renderNodes(){
  const host = document.getElementById('nodes');
  const vis = visNodes();
  host.innerHTML = vis.length
    ? vis.map(nodeHTML).join('')
    : '<div id="canvasVoid" style="position:absolute;left:0;top:0;width:440px;text-align:center;color:var(--mute);font-size:12.5px;line-height:2.2;padding:0 20px">'
      + '<div style="font-size:30px;opacity:.55;margin-bottom:8px">◇</div>'
      + '这一天还没有记录<br>'
      + '<b style="color:var(--dim)">在空白处双击</b>，或者按住左边工具条的 <b style="color:var(--blue)">＋</b> 往这儿一拖，就拉出一个节点<br>'
      + '<span style="color:var(--mute)">之后拖卡片右边的圆点，就能一层层长出子分支</span></div>';
  if(!vis.length){ LAY = {}; HEIGHTS = {}; drawEdges(); drawMinimap(); return; }
  measure(); layout(); applyPos(); drawEdges(); drawMinimap();
  applySearch();
  const mine = document.getElementById('canvasVoid');
  if(mine) mine.remove();
}
function patchCard(id){
  const el = nodeEl(id); if(!el) return;
  const n = byId(id); if(!n) return;
  el.innerHTML = nodeInner(n);
  el.classList.toggle('sel', id === selId);
  reflowSoon();
}
let reflowTm = null;
function reflowSoon(){ clearTimeout(reflowTm); reflowTm = setTimeout(reflow, 110); }
function reflow(){ measure(); layout(); applyPos(); drawEdges(); drawMinimap(); }
/* 折叠↔展开时卡片高度在 200ms 里一直在变，连线必须跟着每帧重排，
   否则线会先连到旧高度、过一会儿才「跳」过去。 */
let reflowRAF = 0;
function reflowFor(ms){
  cancelAnimationFrame(reflowRAF);
  if(prefersReduced()){ reflow(); return; }
  const t0 = performance.now();
  const step = now => {
    reflow();
    if(now - t0 < ms) reflowRAF = requestAnimationFrame(step);
    else reflowRAF = 0;
  };
  reflowRAF = requestAnimationFrame(step);
}
/* 折叠/展开状态同步：真的变了才重排，没变就别做无谓的 measure */
function syncOpen(animate){
  let changed = false;
  document.querySelectorAll('#nodes .nd').forEach(el => {
    const n = byId(el.dataset.id); if(!n) return;
    const want = isOpen(n), had = el.classList.contains('open');
    if(want !== had){ el.classList.toggle('open', want); changed = true; }
  });
  if(!changed) return false;
  if(animate === false || prefersReduced()) reflow(); else reflowFor(240);
  return true;
}
/* 浮动工具条「贴边翻转」：卡片贴近视口顶部时把工具条翻到卡片下方，
   否则它会被顶栏压住、点不到。
   阈值依据：工具条上边缘恒在卡片顶边上方 --to(12px)，顶栏高 54px，
   所以卡片顶边一进到 54+12=66px 以内就该翻，取 70 留 4px 余量。
   （--to 之所以恒定，是 CSS 里用 --inv 反算定位换来的；否则这个阈值还得随 zoom 变。） */
function syncTools(){
  document.querySelectorAll('#nodes .nd').forEach(el => el.classList.remove('tools-below'));
  if(!selId) return;
  const el = nodeEl(selId); if(!el) return;
  el.classList.toggle('tools-below', el.getBoundingClientRect().top < 70);
}
/* 画布上的「拆细一点」幽灵提示：只跟着选中的那张卡片走。
   元素在 #stage 里会被 zoom 缩放，所以反向缩放 1/zoom，屏幕尺寸恒定。 */
function syncKidHint(){
  const h = document.getElementById('kidHint');
  if(!h) return;
  const n = (selId && !editId) ? byId(selId) : null;
  const show = !!n && !!nodeEl(n.id);
  h.classList.toggle('on', show);
  if(!show) return;
  const p = nodePos(n);
  h.style.transform = 'translate(' + Math.round(p.x + NW + 22) + 'px,'
    + Math.round(p.y + anchorY(n.id) - 33) + 'px) scale(' + (1 / zoom).toFixed(3) + ')';
}

/* =========================================================
   选中 / 详情面板
   ========================================================= */
/* 把「选中态」整个收干净：卡片高亮、连线的通电、详情面板里的内容 */
function clearSelection(){
  if(!selId) return;
  selId = null;
  document.querySelectorAll('#nodes .nd.sel').forEach(el => el.classList.remove('sel'));
  syncEdgeHot();
  /* 选中态一撤，那张卡片的「自动展开」也跟着撤（被单独钉成常开的除外） */
  syncOpen();
  syncTools(); syncKidHint();
  renderInspector();
  renderOutline();
  syncInspBtn();
}
function selectNode(id, opts){
  selId = id;
  document.querySelectorAll('#nodes .nd').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  /* 选中的那张自动展开、上一张收回折叠；展开会改高度，
     所以 syncOpen 里会顺带把连线逐帧重排，线才不会先连到旧高度再跳。 */
  syncOpen();
  syncTools(); syncKidHint();
  syncEdgeHot();
  /* 窄屏不再「选中就弹面板」——面板会盖住卡片，反而没法就地编辑；
     要看完整详情点顶栏的「详情」即可 */
  renderInspector();
  renderOutline();
  syncInspBtn();
  if(opts && opts.center) centerOn(id);
}
function centerOn(id){
  const n = byId(id); if(!n) return;
  const p = nodePos(n);
  panX = innerWidth/2 - (p.x + NW/2) * zoom;
  panY = innerHeight/2 - (p.y + anchorY(id)) * zoom;
  applyTransform();
}
function renderInspector(){
  const box = document.getElementById('inspector');
  box.classList.toggle('on', !!inspOpen);
  if(!inspOpen){ box.innerHTML = ''; return; }
  const n = selId ? byId(selId) : null;
  if(!n){    box.innerHTML = '<div class="insp-head"><span class="ico-badge"></span>'
      + '<span style="flex:1;font-size:13.5px;font-weight:600">分支详情</span>'
      + '<button class="ico-btn" id="iCloseEmpty" title="收起">' + ICO.del + '</button></div>'
      + '<div class="insp-empty">还没有选中任何分支。<br>点画布上的任意卡片开始记录，<br>或先<b>新建一条主线分支</b>。</div>'
      + '<div style="padding:0 14px 16px"><button class="btn pri" id="iNewRoot" style="width:100%;justify-content:center">＋ 新建主线分支</button></div>';
    document.getElementById('iCloseEmpty').onclick = () => { inspOpen = false; syncInspBtn(); renderInspector(); };
    document.getElementById('iNewRoot').onclick = () => addBranch(null);
    return;
  }
  const col = sc(n.status);
  const kids = childrenOf(n.id);
  const path = pathOf(n.id);
  const own = durMin(n), total = branchMinutes(n.id);
  const imgs = nodeImgs(n), imgN = imgs.length;
  const crumb = path.map((p, i) =>
    (i ? '<span class="sep">›</span>' : '')
    + '<a data-jump="' + p.id + '">' + esc(trunc(p.title, 12)) + '</a>').join('');

  box.innerHTML =
    '<div class="insp-head">'
      + '<span class="nd-badge" style="background:' + col + '"></span>'
      + '<input class="i-title" id="iTitle" value="' + esc(n.title) + '" placeholder="给这个分支起个名字">'
      + '<button class="ico-btn" id="iFold" title="' + (n.collapsed ? '展开子分支' : '折叠子分支') + '">'
        + (n.collapsed ? '▸' : '▾') + '</button>'
      + '<button class="ico-btn" id="iClose" title="收起面板">' + ICO.del + '</button>'
    + '</div>'
    + '<div class="i-path">' + crumb
      + '<span class="sep">·</span>第 ' + path.length + ' 层'
      + (own != null ? '<span class="sep">·</span>本段 ' + fmtDur(own) : '')
      + (kids.length && total != null ? '<span class="sep">·</span>覆盖 ' + fmtDur(total) : '')
    + '</div>'
    + '<div class="i-body">'
      + '<div class="sec"><h4>时间</h4><div class="row2">'
        + '<div class="fld"><label>开始</label><input type="time" id="iStart" value="' + esc(n.start) + '"></div>'
        + '<div class="fld"><label>结束</label><input type="time" id="iEnd" value="' + esc(n.end) + '"></div>'
      + '</div><div class="quick">'
        + '<button class="qbtn" id="qNow">记当前为起点</button>'
        + '<button class="qbtn" id="qNowEnd">记当前为终点</button>'
        + '<button class="qbtn" id="qClear">清空时间</button>'
        + '<span class="dur-txt" id="iDur">' + (own != null ? '本段时长 ' + fmtDur(own) : '') + '</span>'
      + '</div></div>'
      + '<div class="sec"><h4>状态</h4><div class="chips" id="iStatus">'
        + STATUS.map(s => '<button class="chip' + (n.status===s?' on':'') + '" data-v="' + s + '">' + s + '</button>').join('')
      + '</div></div>'
      + '<div class="sec"><h4>完成度自评</h4><div style="display:flex;align-items:center">'
        + '<div class="stars" id="iRate">'
          + [1,2,3,4,5].map(i => '<span class="star' + (n.rating>=i?' on':'') + '" data-i="' + i + '">★</span>').join('')
        + '</div><span class="rate-txt" id="iRateTxt">' + (n.rating ? n.rating + ' / 5' : '未评分') + '</span>'
      + '</div></div>'
      + '<div class="sec"><h4>具体做了什么</h4><div class="fld">'
        + '<textarea id="iNote" placeholder="写具体的事，带数字：做了什么、多少量、有没有产出物。例如：数学错题复盘 30 道，剩 6 道没搞懂。">' + esc(n.note) + '</textarea>'
      + '</div></div>'
      + '<div class="sec"><h4>图片' + (imgN ? ' · ' + imgN + ' 张' : '') + '</h4><div id="iImgs">'
        + (imgN
            ? '<div class="nd-img-grid">' + imgs.map((u, i) =>
                '<div class="nd-img-cell">'
                + '<img src="' + u + '" alt="卡片图片" data-k="' + i + '" title="点开看大图">'
                + '<button class="nd-img-del" data-i="del" data-k="' + i + '" title="删掉这张">×</button>'
                + '</div>').join('') + '</div>'
              + '<div class="nd-img-bar"><button data-i="pick">＋ 再加几张</button></div>'
            : '<button class="nd-img-add" data-i="pick">' + ICO.pic + '加图片（可多选）</button>')
        + '<div style="color:var(--mute);font-size:11px;margin-top:7px;line-height:1.6">'
          + '一张卡可以放多张，画布上按张数自动排成网格。图片按最长边 1280 压缩后存在本机浏览器里，导出备份时会一起带走。</div>'
      + '</div></div>'
      + '<div class="sec"><h4>子分支 · ' + kids.length + '</h4>'
        + (kids.length
            ? '<div class="subs">' + sortSibs(kids).map(k => {
                const kt = branchMinutes(k.id);
                return '<div class="sub-item" data-jump="' + k.id + '">'
                  + '<span class="bar" style="background:' + (STATUS_COLOR[k.status]||'#6b6b73') + '"></span>'
                  + '<span class="txt"><span class="t1">' + esc(k.title) + '</span>'
                  + '<span class="t2">' + (k.start ? esc(k.start) + (k.end ? (' – ' + esc(k.end)) : '') + '　' : '')
                  + (kt != null ? fmtDur(kt) : '未填时长') + (k.rating ? '　' + '★'.repeat(k.rating) : '') + '</span></span>'
                  + '<span class="go">›</span></div>';
              }).join('') + '</div>'
            : '<div class="no-sub">还没有子分支。<br>点下面按钮，把「' + esc(trunc(n.title,10)) + '」再拆细一点——比如拆成「做错题」「对答案」「归纳错因」。</div>')
        + '<div style="margin-top:10px"><button class="btn sm pri" id="iAdd2">＋ 在「' + esc(trunc(n.title,10)) + '」下新建子分支</button></div>'
      + '</div>'
    + '</div>'
    + '<div class="i-foot">'
      + '<button class="btn sm" id="iDup">复制</button>'
      + '<button class="btn sm" id="iUp"' + (n.parentId == null ? ' disabled style="opacity:.45"' : '') + '>升级一层</button>'
      + '<button class="btn sm danger" id="iDel">删除</button>'
    + '</div>';

  /* ---- 绑定 ---- */
  const tEl = document.getElementById('iTitle');
  tEl.addEventListener('input', () => {
    n.title = tEl.value; save();
    const el = nodeEl(n.id);
    if(el){ el.querySelector('.nd-title').textContent = n.title; el.querySelector('.nd-name').textContent = n.title; }
  });
  tEl.addEventListener('change', pushHist);
  document.getElementById('iClose').onclick = () => { inspOpen = false; syncInspBtn(); renderInspector(); };
  document.getElementById('iFold').onclick = () => {
    n.collapsed = !n.collapsed; save(); pushHist(); render();
  };
  /* 图片：面板上的入口（选中后就不用回画布双击了） */
  const iPick = box.querySelector('[data-i="pick"]');
  if(iPick) iPick.onclick = () => pickNodeImage(n.id);
  box.querySelectorAll('#iImgs img').forEach(im =>
    im.onclick = () => openImage(n.id, +im.dataset.k));
  box.querySelectorAll('#iImgs [data-i="del"]').forEach(b =>
    b.onclick = () => clearNodeImage(n.id, +b.dataset.k));
  box.querySelectorAll('[data-jump]').forEach(el => el.onclick = () => selectNode(el.dataset.jump, {center:true}));

  const fs = document.getElementById('iStart'), fe = document.getElementById('iEnd');
  const onTime = () => {
    n.start = fs.value; n.end = fe.value; save();
    const hint = document.getElementById('iDur');
    const own2 = durMin(n);
    if(hint) hint.textContent = own2 != null ? ('本段时长 ' + fmtDur(own2)) : '';
    patchCard(n.id);
  };
  fs.oninput = fe.oninput = onTime;
  fs.onchange = fe.onchange = pushHist;
  document.getElementById('qNow').onclick = () => { fs.value = nowHM(); onTime(); pushHist(); };
  document.getElementById('qNowEnd').onclick = () => { fe.value = nowHM(); onTime(); pushHist(); };
  document.getElementById('qClear').onclick = () => { fs.value = ''; fe.value = ''; onTime(); pushHist(); };

  box.querySelectorAll('#iStatus .chip').forEach(c => c.onclick = () => {
    n.status = c.dataset.v; save(); pushHist();
    box.querySelectorAll('#iStatus .chip').forEach(x => x.classList.toggle('on', x.dataset.v === n.status));
    const el = nodeEl(n.id);
    if(el){
      el.querySelector('.nd-chip').innerHTML = '<i style="background:' + STATUS_COLOR[n.status] + '"></i>' + esc(n.status);
      el.querySelector('.nd-badge').style.background = STATUS_COLOR[n.status];
    }
    if(n.parentId){ const pel = nodeEl(n.parentId); if(pel) patchCard(n.parentId); }
    drawMinimap();
  });
  const stars = box.querySelectorAll('#iRate .star');
  stars.forEach(s => {
    s.onmouseenter = () => stars.forEach(x => x.classList.toggle('on', +x.dataset.i <= +s.dataset.i));
    s.onclick = () => {
      n.rating = (+s.dataset.i === n.rating) ? 0 : +s.dataset.i;
      save(); pushHist();
      stars.forEach(x => x.classList.toggle('on', +x.dataset.i <= n.rating));
      document.getElementById('iRateTxt').textContent = n.rating ? n.rating + ' / 5' : '未评分';
      patchCard(n.id);
    };
  });
  document.getElementById('iRate').onmouseleave = () => stars.forEach(x => x.classList.toggle('on', +x.dataset.i <= n.rating));
  const nt = document.getElementById('iNote');
  nt.addEventListener('input', () => {
    n.note = nt.value; save();
    /* 卡片重绘（文本域在详情面板里，不受影响），空/有内容两种卡片形态自动切换 */
    patchCard(n.id);
  });
  nt.addEventListener('change', pushHist);

  document.getElementById('iAdd2').onclick = () => addBranch(n.id);
  document.getElementById('iDup').onclick = () => dupDone(dupBranch(n.id));
  const upBtn = document.getElementById('iUp');
  if(upBtn && n.parentId != null) upBtn.onclick = () => {
    const p = byId(n.parentId);
    moveNode(n.id, p ? p.parentId : null); pushHist(); render(); toast('已升级一层');
  };
  document.getElementById('iDel').onclick = () => delAsk(n.id);
}

function syncInspBtn(){
  const b = document.getElementById('inspBtn');
  if(b) b.classList.toggle('on', !!inspOpen);
}

/* ---------- 新建 / 删除 ---------- */
function addBranch(pid){
  const nn = addNode(pid && byId(pid) ? pid : null);
  pushHist();
  selId = nn.id;
  render();
  selectNode(nn.id);
  enterEdit(nn.id, 'title');
  /* 不居中、只揭示：从树上长出来的新分支通常就在父节点旁边，
     硬拽到屏幕正中反而会把刚看清楚的那一段关系甩出视野。
     编辑态卡片更高，所以按 320 估，底部再多留一截。 */
  requestAnimationFrame(() => revealNode(nn.id, { h: 320, padBottom: 70 }));
  return nn;
}
function delAsk(id){
  const n = byId(id); if(!n) return;
  const cnt = descendantsOf(id).length;
  const msg = cnt ? ('删除「' + n.title + '」及其下 ' + cnt + ' 个子分支？') : ('删除「' + n.title + '」？');
  if(!confirm(msg)) return;
  const pid = n.parentId;
  delNode(id);
  pushHist();
  selId = pid && byId(pid) ? pid : (day().nodes[0] ? day().nodes[0].id : null);
  render();
  toast('已删除');
}

/* =========================================================
   画布交互：拖动节点 / 拖入改层级 / 平移缩放
   ========================================================= */
let drag = null, panning = null;
/* 点空白处「取消选中」是延迟执行的，见 onDown 里的说明 */
let blankSelT = 0;

function onDown(e){
  stopPanAnim();       /* 手一碰画布，揭示动画立刻让位，别跟手指抢平移 */
  stopArrange(true);   /* 手一碰画布，整理动画立即落地，免得拖的是「还在飞」的卡片 */
  /* 这一次按下已经落在别处了，上一次排的「取消选中」作废 */
  if(blankSelT){ clearTimeout(blankSelT); blankSelT = 0; }
  /* 正在编辑别的卡片 → 先把编辑收工，免得拿着已经失效的 DOM 继续拖 */
  if(editId && !(e.target.closest && e.target.closest('.nd.editing'))) exitEdit(true);

  /* ① 从卡片右侧圆点按住拖 → 拉出一个子分支 */
  const port = e.target.closest ? e.target.closest('.nd-port') : null;
  if(port && e.button === 0){
    const pid = port.dataset.port;
    if(byId(pid)){
      port.classList.add('dragging');
      resetDropSlot();                 /* 新的一次拖拽：落点要重新预测 */
      makeDrag = { pid, fromTool:false, sx:e.clientX, sy:e.clientY, moved:false, target:null };
      const w = s2w(e.clientX, e.clientY);
      drawGhostLine(pid, w);
      attach();
      e.preventDefault();
      return;
    }
  }

  const ndEl = e.target.closest ? e.target.closest('.nd') : null;
  const isMid = e.button === 1;
  if(ndEl && !isMid && !e.target.closest('button, a, input, textarea') && !ndEl.classList.contains('editing')){
    const id = ndEl.dataset.id;
    /* 点画布卡片时把焦点从详情输入框收回，保证随后的快捷键（N/Tab/Delete）生效 */
    if(document.activeElement && document.activeElement.blur
       && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)
       && !ndEl.contains(document.activeElement)) document.activeElement.blur();
    selectNode(id);
    const n = byId(id); if(!n) return;
    const p = nodePos(n);
    drag = { id, sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y, moved:false, target:null };
    attach();
    e.preventDefault();
    return;
  }
  if(e.target.closest && e.target.closest('#toolbar, #bottombar, #minimap, #inspector, #topbar, #ctx, #pop')) return;
  if(ndEl) return;
  /* 落在空白处 = 取消选中。等 200ms 再清，是因为「Shift + 双击空白」
     的第一下也会走到这里：真双击的话第二下会把这个定时器撤掉，
     挂在当前分支下的操作才读得到刚才选中的那条。 */
  if(selId) blankSelT = setTimeout(() => { blankSelT = 0; clearSelection(); }, 200);
  panning = { sx:e.clientX, sy:e.clientY, px:panX, py:panY };
  document.getElementById('canvas').classList.add('panning');
  attach();
  e.preventDefault();
}
function attach(){
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
function detach(){
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onUp);
}
function onMove(e){
  if(panning){
    panX = panning.px + (e.clientX - panning.sx);
    panY = panning.py + (e.clientY - panning.sy);
    applyTransform();
    return;
  }

  /* 拖出一个新节点 */
  if(makeDrag){
    const dx = e.clientX - makeDrag.sx, dy = e.clientY - makeDrag.sy;
    if(!makeDrag.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
    if(!makeDrag.moved){
      makeDrag.moved = true;
      document.getElementById('canvas').style.cursor = 'crosshair';
    }
    const w = s2w(e.clientX, e.clientY);
    /* 落在别的卡片上 → 认它当父分支 */
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const tn = under && under.closest ? under.closest('.nd') : null;
    let tid = tn ? tn.dataset.id : null;
    const bad = tid && (tid === makeDrag.pid
      || (makeDrag.pid && descendantsOf(makeDrag.pid).some(k => k.id === tid)));
    if(bad) tid = null;
    /* 端口不能拖到自己身上 */
    if(makeDrag.pid && tid === makeDrag.pid) tid = null;
    document.querySelectorAll('#nodes .nd.dropin').forEach(el => el.classList.remove('dropin'));
    makeDrag.target = tid;
    if(tid){
      const tEl = nodeEl(tid);
      if(tEl) tEl.classList.add('dropin');
      const tp = nodePos(byId(tid));
      if(makeDrag.pid) drawGhostLine(makeDrag.pid, { x: tp.x, y: tp.y + anchorY(tid) });
      const slot = dropSlot(tid) || tp;
      showDropGhost(slot.x, slot.y, true);
    } else {
      if(makeDrag.pid) drawGhostLine(makeDrag.pid, w);
      showDropGhost(w.x, w.y - 36, false);
    }
    return;
  }

  if(!drag) return;
  const dx = (e.clientX - drag.sx) / zoom, dy = (e.clientY - drag.sy) / zoom;
  if(!drag.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
  if(!drag.moved){
    drag.moved = true;
    nodeEl(drag.id).classList.add('dragging');
    document.getElementById('canvas').style.cursor = 'grabbing';
  }
  const n = byId(drag.id);
  n.x = clamp(drag.ox + dx, -POS_LIMIT, POS_LIMIT);
  n.y = clamp(drag.oy + dy, -POS_LIMIT, POS_LIMIT);
  applyPos(); drawEdges(); drawMinimap();
  /* 命中检测：拖到别的节点上 = 变成它的子分支 */
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const tn = under && under.closest ? under.closest('.nd') : null;
  const tid = tn ? tn.dataset.id : null;
  document.querySelectorAll('#nodes .nd.dropin').forEach(el => el.classList.remove('dropin'));
  drag.target = null;
  if(tid && tid !== drag.id && !descendantsOf(drag.id).some(k => k.id === tid)){
    const tEl = nodeEl(tid);
    if(tEl){ tEl.classList.add('dropin'); drag.target = tid; }
  }
}
function onUp(e){
  detach();
  document.getElementById('canvas').classList.remove('panning');
  document.getElementById('canvas').style.cursor = '';
  if(panning){ panning = null; drawMinimap(); return; }

  /* 拖出一个新节点：松手落地 */
  if(makeDrag){
    const m = makeDrag; makeDrag = null;
    hideDropGhost();
    if(!m.moved){
      if(m.fromTool) return;          /* 只是点了一下工具条，交给它自己的 click */
      addBranch(m.pid);               /* 只是点了一下圆点 = 直接加一个子分支 */
      return;
    }
    if(m.fromTool){
      /* 这次是拖拽，别让按钮接下来的 click 又建一个 */
      suppressAdd = true;
      setTimeout(() => { suppressAdd = false; }, 400);
    }
    const w = s2w(e.clientX, e.clientY);
    const pid = m.target || m.pid || null;
    if(m.target){
      /* 落到别的卡片上：挂到它下面，位置交给自动布局（正是拖拽时预览框停的那一格）。
         这里绝不能再动视口：预览框已经承诺了落点，镜头一挪「所见即所得」就断了
         （实测会把整张卡片挪走 29~39px，正好是平移量）。拖拽全程视口都不该变。 */
      const nn = addNode(m.target);
      save(); pushHist();
      selId = nn.id;
      render();
      enterEdit(nn.id, 'title');
      toast('已挂到「' + trunc(byId(m.target).title, 10) + '」下面，直接输名字');
      return;
    }
    addBranchAt(pid, w);
    return;
  }

  if(!drag) return;
  const d = drag; drag = null;
  const el = nodeEl(d.id);
  if(el) el.classList.remove('dragging');
  document.querySelectorAll('#nodes .nd.dropin').forEach(x => x.classList.remove('dropin'));
  if(!d.moved){ applyPos(); return; }
  if(d.target){
    if(moveNode(d.id, d.target)){ pushHist(); render(); toast('已变成「' + trunc(byId(d.target).title,10) + '」的子分支'); }
    else { toast('不能把分支移进它自己的子分支里'); renderNodes(); }
  } else {
    save(); pushHist();
  }
}
document.getElementById('canvas').addEventListener('pointerdown', onDown);
/* 空白处双击 = 就地拉出一个节点（按住 Shift 则挂在当前选中的分支下） */
document.getElementById('canvas').addEventListener('dblclick', e => {
  if(e.target.closest && e.target.closest('.nd, #toolbar, #bottombar, #minimap, #inspector, #topbar, #ctx, #pop')) return;
  const w = s2w(e.clientX, e.clientY);
  const asChild = e.shiftKey && selId && byId(selId);
  addBranchAt(asChild ? selId : null, w);
});
document.getElementById('canvas').addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.004 : 0.0016));
  setZoom(zoom * f, e.clientX, e.clientY);
}, { passive:false });
document.addEventListener('pointerdown', e => {
  if(!e.target.closest('#pop')) document.getElementById('pop').classList.remove('on');
  /* 点画布之外的工具栏 / 面板 = 结束卡片编辑（画布内的由 onDown 处理） */
  if(!editId) return;
  if(e.target.closest && e.target.closest('#canvas, .nd.editing, #inspector, #mask, #pop')) return;
  exitEdit(true);
}, true);

/* ---------- 节点上的按钮 / 输入 / 双击 / 右键（委托） ---------- */
document.getElementById('nodes').addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if(b){
    e.stopPropagation();
    const id = b.dataset.id, a = b.dataset.a;
    const n = byId(id);
    if(a === 'add'){ addBranch(id); }
    else if(a === 'edit'){ enterEdit(id, 'note'); }
    else if(a === 'chain'){ setChain(id); }
    else if(a === 'dup'){ dupDone(dupBranch(id)); }
    else if(a === 'del'){ delAsk(id); }
    else if(a === 'status' && n){ cycleStatus(n); }
    else if(a === 'pickimg'){ pickNodeImage(id); }
    else if(a === 'delimg'){ clearNodeImage(id, +(b.dataset.i || 0)); }
    else if(a === 'viewimg' && n){ openImage(id, +(b.dataset.i || 0)); }
    else if(a === 'setstatus' && n){
      n.status = b.dataset.v; save(); pushHist();
      refreshEditChrome(n.id);
      if(editId !== n.id) patchCard(n.id);
      toast('状态改成「' + n.status + '」');
    }
    else if(a === 'rate' && n){
      const v = +b.dataset.v;
      n.rating = (n.rating === v ? 0 : v);
      save(); pushHist();
      if(editId === n.id) refreshStars(n.id); else patchCard(n.id);
      toast(n.rating ? ('完成度 ' + n.rating + '/5') : '已取消评分');
    }
    return;
  }
  /* 选中兜底：指针事件之外（键盘/无障碍/脚本触发）也能靠 click 选中卡片 */
  const nd = e.target.closest('.nd');

});
/* 卡片里直接打字 = 直接改内容，不用去右侧面板 */

  if(!t) return;

  else if(a === 'note'){ n.note = t.value; save(); }
  else if(a === 'tstart'){ n.start = t.value; save(); refreshDur(el, n); }
  else if(a === 'tend'){ n.end = t.value; save(); refreshDur(el, n); }

document.getElementById('nodes').addEventListener('keydown', e => {
  if(!(e.target.closest && e.target.closest('.nd.editing'))) return;
  if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); exitEdit(); return; }
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); e.stopPropagation(); exitEdit(); return; }
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.a === 'title'){
    e.preventDefault(); e.stopPropagation();
    const host = e.target.closest ? e.target.closest('.nd') : null;
    const cur = host ? byId(host.dataset.id) : null;
    /* 锁定模式：回车 = 继续往同一支下加一个（连续拆分，手不用离开键盘） */
    if(chainPid && byId(chainPid)){ addBranch(chainPid); return; }
    /* 普通模式：回车 = 提交并建一个同级；Shift+回车 = 建子级。
       这是 Xmind 用户的肌肉记忆——「回车往下长、Tab 往右长」。 */
    if(!cur){ e.target.blur(); return; }
    if(e.shiftKey){ addBranch(cur.id); return; }
    const nn = addSiblingOf(cur.id);
    if(nn){
      selId = nn.id; render(); enterEdit(nn.id, 'title');
      requestAnimationFrame(() => revealNode(nn.id, { h: 320, padBottom: 70 }));
    }
    else e.target.blur();
  }
});

function openCtx(x, y, id){
  const ctx = document.getElementById('ctx');
  const n = byId(id); if(!n) return;
  const kids = descendantsOf(id).length;
  ctx.innerHTML =
    '<button data-c="edit">✎　编辑内容（就地改）</button>'
  + '<button data-c="add">＋　新建子分支</button>'
  + '<button data-c="sib">＋　新建同级分支</button>'
  + '<button data-c="focus">◎　居中显示</button>'
  + '<button data-c="dup">⧉　连同子分支复制</button>'
  + '<button data-c="up">↑　升级一层</button>'
  + '<button data-c="reset">⇱　放回自动布局</button>'
  + '<div class="sep"></div>'
  + '<button data-c="collapse">' + (n.collapsed ? '▾　展开子分支' : '▸　折叠子分支') + '</button>'
  + '<div class="sep"></div>'
  + '<button class="danger" data-c="del">✕　删除' + (kids ? ('（含 ' + kids + ' 个子分支）') : '') + '</button>';
  ctx.classList.add('on');
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.min(x, innerWidth - w - 8) + 'px';
  ctx.style.top = Math.min(y, innerHeight - h - 8) + 'px';
  ctx.querySelectorAll('button').forEach(b => b.onclick = () => {
    const c = b.dataset.c; ctx.classList.remove('on');
    const node = byId(id); if(!node) return;
    if(c === 'edit') enterEdit(id, 'note');
    else if(c === 'add') addBranch(id);
    else if(c === 'sib') addBranch(node.parentId);
    else if(c === 'focus') selectNode(id, {center:true});
    else if(c === 'dup'){ dupDone(dupBranch(id)); }
    else if(c === 'up'){
      if(node.parentId == null) toast('已经在顶层了');
      else { moveNode(id, (byId(node.parentId)||{}).parentId || null); pushHist(); render(); toast('已升级一层'); }
    }
    else if(c === 'reset'){ node.x = null; node.y = null; save(); pushHist(); render(); toast('已放回自动布局'); }
    else if(c === 'collapse'){ node.collapsed = !node.collapsed; save(); pushHist(); render(); }
    else if(c === 'del') delAsk(id);
  });
}

}

function statsPanel(){
  const nodes = day().nodes;
  if(!nodes.length) return openModal('<h3>今日统计</h3><p>还没有数据。</p>'
    + '<div class="modal-foot"><button class="btn pri" onclick="closeModal()">好</button></div>');
  const withTime = nodes.filter(n => durMin(n) != null);
  const spans = withTime.map(n => { let a=toMin(n.start), b=toMin(n.end); if(b<a) b+=1440; return [a,b]; }).sort((x,y)=>x[0]-y[0]);
  let union = 0;
  if(spans.length){
    let cs = spans[0][0], ce = spans[0][1];
    for(let i=1;i<spans.length;i++){
      if(spans[i][0] <= ce) ce = Math.max(ce, spans[i][1]);
      else { union += ce-cs; cs = spans[i][0]; ce = spans[i][1]; }
    }
    union += ce - cs;
  }
  const byStatus = {};
  STATUS.forEach(s => byStatus[s] = { count:0, min:0 });
  nodes.forEach(n => {
    const k = byStatus[n.status] ? n.status : '其他';
    byStatus[k].count++;
    const d = durMin(n); if(d != null && !childrenOf(n.id).length) byStatus[k].min += d;
  });
  const rated = nodes.filter(n => n.rating > 0);
  const avgRate = rated.length ? (rated.reduce((a,n)=>a+n.rating,0)/rated.length) : 0;
  const maxDepth = nodes.reduce((m,n) => Math.max(m, pathOf(n.id).length), 0);
  const roots = childrenOf(null).length;
  const leaves = nodes.filter(n => !childrenOf(n.id).length).length;
  const statusMax = Math.max(1, ...Object.values(byStatus).map(v=>Math.max(v.count, Math.round(v.min/60*10))));
  const tile = (k, v, unit, sub) => '<div style="background:var(--surface-1);border:1px solid var(--line);border-radius:11px;padding:13px 15px">'
    + '<div style="font-size:11px;color:var(--mute);margin-bottom:5px">' + k + '</div>'
    + '<div style="font-size:22px;font-weight:600;font-variant-numeric:tabular-nums">' + v
      + (unit ? '<small style="font-size:11.5px;color:var(--mute);font-weight:400;margin-left:3px">' + unit + '</small>' : '') + '</div>'
    + '<div style="font-size:11px;color:var(--mute);margin-top:3px">' + sub + '</div></div>';
  openModal('<h3>今日统计</h3><p>' + curDate + '（' + weekName(curDate) + '）</p>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px">'
      + tile('分支总数', nodes.length, '个', roots + ' 条主线 · ' + leaves + ' 个末端分支')
      + tile('最大层级', maxDepth, '层', '最深的一条分支链')
      + tile('时间覆盖', fmtDur(union), '', '所有分支去重后的总时长')
      + tile('平均满意度', avgRate ? avgRate.toFixed(1) : '—', avgRate ? '/ 5' : '', rated.length ? ('已评 ' + rated.length + ' 个') : '还没有评分')
    + '</div>'
    + '<div class="sec"><h4>状态分布</h4>'
      + STATUS.filter(s => byStatus[s].count).map(s => {
          const v = byStatus[s];
          return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
            + '<span style="width:56px;flex-shrink:0;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px">'
              + '<i style="width:7px;height:7px;border-radius:50%;background:' + STATUS_COLOR[s] + '"></i>' + s + '</span>'
            + '<span style="flex:1;height:18px;background:var(--input-bg);border-radius:5px;overflow:hidden">'
              + '<span style="display:block;height:100%;width:' + (v.count/statusMax*100).toFixed(1) + '%;background:' + STATUS_COLOR[s] + '"></span></span>'
            + '<span style="width:108px;flex-shrink:0;text-align:right;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums">'
              + v.count + ' 个' + (v.min ? (' · ' + fmtDur(v.min)) : '') + '</span>'
          + '</div>';
        }).join('')
      + '<div style="font-size:11px;color:var(--mute);margin-top:6px">条形长度 = 分支数量；时长只累计末端分支，避免与父分支重复计算。</div>'
    + '</div>'
    + '<div class="sec"><h4>各主线覆盖时长</h4>'
      + childrenOf(null).map(r => {
          const m = branchMinutes(r.id);
          const maxM = Math.max(1, ...childrenOf(null).map(x => branchMinutes(x.id) || 0));
          return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
            + '<span style="width:76px;flex-shrink:0;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(trunc(r.title,7)) + '</span>'
            + '<span style="flex:1;height:18px;background:var(--input-bg);border-radius:5px;overflow:hidden">'
              + '<span style="display:block;height:100%;width:' + ((m||0)/maxM*100).toFixed(1) + '%;background:' + (STATUS_COLOR[r.status]||'#6b6b73') + '"></span></span>'
            + '<span style="width:82px;flex-shrink:0;text-align:right;font-size:11.5px;color:var(--dim)">' + (m != null ? fmtDur(m) : '—') + '</span>'
          + '</div>';
        }).join('')
    + '</div>'
    + '<div class="sec"><h4>分支结构（缩进树）</h4>'
      + '<pre style="font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.85;color:var(--dim);overflow:auto">' + rootsTxt() + '</pre></div>'
    + '<div class="modal-foot"><button class="btn pri" onclick="closeModal()">关闭</button></div>', true);
}
function rootsTxt(){
  const rootArr = childrenOf(null);
  let out = '';
  const walk = (n, prefix, last) => {
    out += prefix + (last ? '└─ ' : '├─ ') + n.title
      + (n.start ? ('  [' + n.start + (n.end ? ('-' + n.end) : '') + ']') : '')
      + (n.rating ? ('  ' + '★'.repeat(n.rating)) : '')
      + '  (' + n.status + ')\n';
    const kids = childrenOf(n.id);
    const np = prefix + (last ? '   ' : '│  ');
    kids.forEach((k,i) => walk(k, np, i === kids.length-1));
  };
  rootArr.forEach((r,i) => walk(r, '', i === rootArr.length-1));
  return esc(out || '（空）');
}

function dl(name, text){
  const blob = new Blob([text], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

}

/* =========================================================
   大纲视图（测试版新增）
   与画布双向联动：列表里点一行 → 画布把它居中并展开；画布上选中一张
   → 列表高亮并滚到可见。
   值得加的理由：画布负责「梳理」，大纲负责「录入」，这是两种心情。
   参考 Xmind 2026.4 的「导图 ⇄ 大纲自由切换」。
   ========================================================= */
function openOutline(force){
  olOpen = (force == null) ? !olOpen : !!force;
  document.body.classList.toggle('outline-open', olOpen);
  document.getElementById('outline').classList.toggle('on', olOpen);
  const t = document.querySelector('[data-t="outline"]');
  if(t) t.classList.toggle('on', olOpen);
  renderOutline();
  if(olOpen) openView();      /* 左侧多占 300px，取景要重算，别让卡片躲在面板后面 */
  reflow();
  toast(olOpen ? '大纲已打开：回车建同级 · Shift+回车建子级' : '大纲已收起');
}
function renderOutline(){
  const box = document.getElementById('outline');
  const body = document.getElementById('olBody');
  if(!box || !body) return;
  box.classList.toggle('on', olOpen);
  if(!olOpen) return;
  const roots = visChildren(null);
  if(!roots.length){
    body.innerHTML = '<div class="pl-empty">这一天还没有分支<br>用下面的按钮建一条，或回画布双击空白处</div>';
    return;
  }
  let html = '';
  const walk = (pid, depth) => {
    visChildren(pid).forEach(n => {
      const kids = childrenOf(n.id);
      const d = durMin(n);
      const tm = (n.start ? esc(n.start) : '') + (d != null ? (n.start ? ' · ' : '') + fmtDur(d) : '');
      html += '<div class="ol-row' + (n.id === selId ? ' sel' : '') + '" data-ol="' + n.id + '"'
        + ' style="padding-left:' + (6 + depth * 15) + 'px">'
        + '<span class="ol-tw' + (kids.length ? '' : ' leaf') + '" data-olt="' + n.id + '">'
          + (n.collapsed ? '▸' : '▾') + '</span>'
        + '<span class="ol-dot" style="background:' + branchColor(n.id) + '"></span>'
        + '<span class="ol-ti">' + esc(n.title) + '</span>'
        + '<span class="ol-tm">' + tm + '</span>'
      + '</div>';
      if(kids.length && !n.collapsed) walk(n.id, depth + 1);
    });
  };
  walk(null, 0);
  body.innerHTML = html;
  const cur = body.querySelector('.ol-row.sel');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest' });
}
function bindOutline(){
  const body = document.getElementById('olBody');
  if(!body) return;
  body.addEventListener('click', e => {
    const tw = e.target.closest && e.target.closest('[data-olt]');
    if(tw){
      e.stopPropagation();
      const n = byId(tw.dataset.olt); if(!n) return;
      n.collapsed = !n.collapsed; save(); pushHist(); render();
      return;
    }
    const row = e.target.closest && e.target.closest('[data-ol]');
    if(row) selectNode(row.dataset.ol, { center:true });
  });
  const cl = document.getElementById('olClose');
  if(cl) cl.onclick = () => openOutline(false);

}

/* =========================================================
   命令面板（Ctrl/Cmd + K）
   一个输入框干三件事：搜任意一天的分支并飞过去 / 执行命令 / 直接新建。
   参考 Excalidraw 的 Command Palette 与 Obsidian Canvas 的
   「四个月前的图还能按内容找到，而不是靠记住放在哪」。
   ========================================================= */
let palOpen = false, palRows = [], palItems = [], palIdx = 0;
const PAL_CMDS = [
  { id:'tidy', t:'整理布局 · 只推开重叠（保持手工位置）', k:'点工具条', run:() => autoArrange('soft') },
  { id:'tidyfull', t:'整理布局 · 彻底重排成树形', k:'Alt + 点', run:() => autoArrange('full') },
  { id:'outline', t:'切换大纲视图', k:'Ctrl + \\', run:() => openOutline() },
  { id:'openall', t:'展开 / 收起全部卡片', k:'Alt + E', run:() => toggleAllOpen() },
  { id:'cal', t:'日历热力图（看哪几天断了）', run:() => openCalendar() },
  { id:'theme', t:'切换浅色 / 深色主题', run:toggleTheme },
  { id:'bg', t:'背景设置', run:bgPanel },
  { id:'days', t:'记录列表 / 切换日期', run:dayPanel },
  { id:'cal', t:'日历热力图', run:() => openCalendar() },
  { id:'timeline', t:'时间轴', run:timelinePanel },
  { id:'stats', t:'今日统计', run:statsPanel },
  { id:'export', t:'导出 Markdown / OPML / 长图 / JSON', run:exportPanel },
  { id:'fit', t:'适应视图', run:() => fitView() },
  { id:'fit100', t:'回到 100%', k:'0', run:() => setZoom(1) }
];
function openPalette(prefill){
  palOpen = true;
  const box = document.getElementById('palette');
  const inp = document.getElementById('plInput');
  if(!box || !inp) return;
  inp.value = prefill || '';
  palIdx = 0;
  box.classList.add('on');
  renderPalette(inp.value);
  inp.focus();
}
function closePalette(){
  palOpen = false;
  const box = document.getElementById('palette');
  if(box) box.classList.remove('on');
}
/* 跨天搜索：标题命中排在备注命中前面，今天的排在别的日期前面 */
function paletteSearch(q){
  const needle = q.toLowerCase();
  const out = [];
  Object.keys(store.days).forEach(ds => {
    (store.days[ds].nodes || []).forEach(n => {
      const t = String(n.title || '').toLowerCase();
      const nt = String(n.note || '').toLowerCase();
      if(t.includes(needle)) out.push({ n, ds, s:0 });
      else if(nt.includes(needle)) out.push({ n, ds, s:1 });
    });
  });
  out.sort((a, b) => {
    const da = a.ds === curDate ? 0 : 1, db = b.ds === curDate ? 0 : 1;
    return (da - db) || (a.s - b.s) || (a.ds < b.ds ? 1 : -1);
  });
  return out.slice(0, 14);
}
function paletteBuild(q){
  const qq = String(q || '').trim();
  const rows = [], acts = [];
  const push = r => { rows.push(r); if(r.type !== 'grp') acts.push(r); };
  if(!qq){
    push({ type:'grp', t:'常用' });
    PAL_CMDS.slice(0, 6).forEach(c => push({ type:'cmd', c }));
    const recent = flattenVis().slice(0, 5);
    if(recent.length){
      push({ type:'grp', t:'今天的分支' });
      recent.forEach(n => push({ type:'node', n, ds:curDate }));
    }
  } else {
    const cmds = PAL_CMDS.filter(c => c.t.includes(qq) || c.id.includes(qq.toLowerCase())).slice(0, 5);
    if(cmds.length){ push({ type:'grp', t:'命令' }); cmds.forEach(c => push({ type:'cmd', c })); }
    const ns = paletteSearch(qq);
    if(ns.length){
      push({ type:'grp', t:'分支（回车跳过去）' });
      ns.forEach(x => push({ type:'node', n:x.n, ds:x.ds }));
    }
    push({ type:'grp', t:'新建' });
    push({ type:'new', title:qq });
  }
  return { rows, acts };
}
function renderPalette(q){
  const list = document.getElementById('plList');
  if(!list) return;
  const { rows, acts } = paletteBuild(q);
  palRows = rows; palItems = acts;
  if(palIdx >= acts.length) palIdx = Math.max(0, acts.length - 1);
  let html = '', ai = 0;
  rows.forEach(r => {
    if(r.type === 'grp'){ html += '<div class="pl-grp">' + esc(r.t) + '</div>'; return; }
    const on = ai === palIdx;
    if(r.type === 'cmd'){
      html += '<div class="pl-it' + (on ? ' on' : '') + '" data-pi="' + ai + '">'
        + '<span style="flex:1;min-width:0">' + esc(r.c.t) + '</span>'
        + (r.c.k ? '<span class="pl-k">' + esc(r.c.k) + '</span>' : '') + '</div>';
    } else if(r.type === 'node'){
      const dot = (r.ds === curDate) ? branchColor(r.n.id) : sc(r.n.status);
      const meta = (r.ds === curDate ? '' : r.ds + ' · ') + (r.n.note || r.n.start || '');
      html += '<div class="pl-it' + (on ? ' on' : '') + '" data-pi="' + ai + '">'
        + '<span class="pl-dot" style="background:' + dot + '"></span>'
        + '<span class="pl-ti" style="flex-shrink:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.n.title) + '</span>'
        + '<span class="pl-sub">' + esc(meta) + '</span>'
        + '<span class="pl-k">跳过去</span></div>';
    } else {
      html += '<div class="pl-it' + (on ? ' on' : '') + '" data-pi="' + ai + '">'
        + '<span style="flex:1;min-width:0">＋ 新建分支：' + esc(r.title) + '</span>'
        + '<span class="pl-k">回车</span></div>';
    }
    ai++;
  });
  list.innerHTML = html || '<div class="pl-empty">没有匹配的分支</div>';
  const cur = list.querySelector('.pl-it.on');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:'nearest' });
}
function paletteRun(i){
  const it = palItems[i]; if(!it) return;
  closePalette();
  if(it.type === 'cmd'){ it.c.run(); return; }
  if(it.type === 'new'){
    const pid = (selId && byId(selId)) ? selId : null;
    const nn = addNode(pid, it.title);
    save(); pushHist();
    selId = nn.id; render();
    enterEdit(nn.id, 'title');
    toast('已新建分支');
    return;
  }
  /* 跨天跳转：先把折叠的祖先展开，否则选中了也看不见 */
  if(it.ds !== curDate){ curDate = it.ds; }
  let cur = byId(it.n.id);
  const guard = new Set();
  while(cur && cur.parentId != null && !guard.has(cur.id)){
    guard.add(cur.id);
    const p = byId(cur.parentId);
    if(!p) break;
    p.collapsed = false;
    cur = p;
  }
  save(); render();
  selectNode(it.n.id, { center:true });
  toast('已跳到「' + trunc(it.n.title, 14) + '」');
}
function bindPalette(){
  const inp = document.getElementById('plInput');
  const box = document.getElementById('palette');
  if(!inp || !box) return;
  inp.addEventListener('input', () => { palIdx = 0; renderPalette(inp.value); });
  inp.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); if(palItems.length){ palIdx = (palIdx + 1) % palItems.length; renderPalette(inp.value); } }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); if(palItems.length){ palIdx = (palIdx - 1 + palItems.length) % palItems.length; renderPalette(inp.value); } }
    else if(e.key === 'Enter'){ e.preventDefault(); paletteRun(palIdx); }
    else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closePalette(); }
  });
  const list = document.getElementById('plList');
  list.addEventListener('click', e => {
    const it = e.target.closest && e.target.closest('[data-pi]');
    if(it) paletteRun(+it.dataset.pi);
  });
  box.addEventListener('pointerdown', e => { if(e.target === box) closePalette(); });
}

/* =========================================================
   日历热力图
   一格一天、按当天的分支数着色深浅：切日期、看断档、看积累，一屏三件事。
   参考「时间戳日记」的日历圆点与 GitHub 贡献图。
   ========================================================= */
let calMonth = '', calRender = null;
function openCalendar(){
  const pop = document.getElementById('pop');
  const pill = document.getElementById('datePill');
  if(!pop || !pill) return;
  if(!calMonth) calMonth = curDate.slice(0, 7);
  calRender = () => {
    const y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7);
    const lead = new Date(y, m - 1, 1).getDay();
    const dim = new Date(y, m, 0).getDate();
    const today = fmtDate(new Date());
    let cells = '', monthCnt = 0, monthDays = 0;
    for(let i = 0; i < lead; i++) cells += '<span class="cal-d void"></span>';
    for(let dd = 1; dd <= dim; dd++){
      const ds = calMonth + '-' + String(dd).padStart(2, '0');
      const arr = (store.days[ds] && store.days[ds].nodes) || [];
      const cnt = arr.length;
      if(cnt){ monthDays++; monthCnt += cnt; }
      const lv = cnt === 0 ? 0 : cnt <= 2 ? 1 : cnt <= 4 ? 2 : cnt <= 7 ? 3 : 4;
      cells += '<span class="cal-d' + (lv ? ' l' + lv : '') + (ds === today ? ' today' : '')
        + (ds === curDate ? ' cur' : '') + '" data-d="' + ds + '"'
        + ' title="' + ds + ' · ' + cnt + ' 个分支">' + dd + '</span>';
    }
    const p = pill.getBoundingClientRect();
    pop.innerHTML =
      '<div class="cal-top"><button class="btn sm" id="calPrev">‹</button>'
      + '<b>' + y + ' 年 ' + m + ' 月</b><button class="btn sm" id="calNext">›</button></div>'
      + '<div class="cal-grid">' + '日一二三四五六'.split('').map(w => '<span class="cal-w">' + w + '</span>').join('') + cells + '</div>'
      + '<div class="cal-leg"><span>少</span>'
        + '<i style="background:var(--surface-1)"></i>'
        + '<i style="background:rgba(59,110,245,.14)"></i>'
        + '<i style="background:rgba(59,110,245,.30)"></i>'
        + '<i style="background:rgba(59,110,245,.55)"></i>'
        + '<i style="background:rgba(59,110,245,.86)"></i><span>多</span>'
        + '<span style="margin-left:auto">' + monthDays + ' 天有记录 · ' + monthCnt + ' 个分支</span></div>'
      + '<div class="pop-row" style="margin-top:10px">'
        + '<button class="btn sm" id="popPrev">‹ 前一天</button>'
        + '<button class="btn sm" id="popToday">回到今天</button>'
        + '<button class="btn sm" id="popNext">后一天 ›</button></div>'
      + '<div class="pop-row" style="margin-top:6px"><button class="btn sm" id="popList">记录列表</button></div>';
    pop.style.width = '286px';
    pop.style.left = Math.max(8, Math.min(p.left - 130, innerWidth - 300)) + 'px';
    pop.style.top = (p.bottom + 8) + 'px';
    pop.classList.add('on');
    document.getElementById('calPrev').onclick = () => {
      const d = new Date(y, m - 2, 1);
      calMonth = fmtDate(d).slice(0, 7); calRender();
    };
    document.getElementById('calNext').onclick = () => {
      const d = new Date(y, m, 1);
      calMonth = fmtDate(d).slice(0, 7); calRender();
    };
    document.getElementById('popPrev').onclick = () => { pop.classList.remove('on'); shiftDay(-1); };
    document.getElementById('popNext').onclick = () => { pop.classList.remove('on'); shiftDay(1); };
    document.getElementById('popToday').onclick = () => {
      curDate = fmtDate(new Date()); calMonth = curDate.slice(0, 7);
      selId = null; pop.classList.remove('on'); render(); openView();
    };
    document.getElementById('popList').onclick = () => { pop.classList.remove('on'); dayPanel(); };
    pop.querySelectorAll('[data-d]').forEach(el => el.onclick = () => {
      curDate = el.dataset.d; calMonth = curDate.slice(0, 7);
      selId = null; pop.classList.remove('on'); render(); openView();
      toast('已切到 ' + curDate + '（' + (day().nodes.length) + ' 个分支）');
    });
  };
  calRender();
}

/* =========================================================
   导出：Markdown / OPML / 长图
   JSON 是给自己备份的，这三种是「能给别人看 / 能搬去别的工具」的。
   OPML 是这一行的通用交换格式：Xmind、MindNode、GitMind 都认。
   ========================================================= */
function xesc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function dayOf(ds){ return (store.days[ds] && store.days[ds].nodes) || []; }
function dsKids(nodes, pid){ return nodes.filter(n => n.parentId === pid); }
function dayMarkdown(ds){
  const nodes = dayOf(ds);
  const out = ['# ' + (store.projectName || '我的每日记录') + ' · ' + ds + ' ' + weekName(ds), ''];
  const walk = (pid, depth) => {
    dsKids(nodes, pid).forEach(n => {
      const span = [n.start, n.end].filter(Boolean).join('–');
      const meta = [span, n.status, n.rating ? n.rating + '/5' : ''].filter(Boolean).join(' · ');
      out.push('  '.repeat(depth) + '- **' + n.title + '**' + (meta ? '　`' + meta + '`' : ''));
      if(n.note && n.note.trim()) n.note.trim().split('\n').forEach(l => out.push('  '.repeat(depth + 1) + l));
      walk(n.id, depth + 1);
    });
  };
  walk(null, 0);
  if(out.length <= 2) out.push('（这一天还没有分支）');
  return out.join('\n') + '\n';
}
function dayOpml(ds){
  const nodes = dayOf(ds);
  const one = (n, pad) => {
    const span = [n.start, n.end].filter(Boolean).join('–');
    const note = [n.status, span, n.rating ? n.rating + '/5' : '', (n.note || '').replace(/\s+/g, ' ')]
      .filter(Boolean).join(' · ');
    const ks = dsKids(nodes, n.id);
    const head = pad + '<outline text="' + xesc(n.title) + '" _note="' + xesc(note) + '"';
    if(!ks.length) return head + '/>';
    return head + '>\n' + ks.map(k => one(k, pad + '  ')).join('\n') + '\n' + pad + '</outline>';
  };
  return '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<opml version="2.0">\n  <head><title>' + xesc(store.projectName || '我的每日记录') + ' · ' + ds + '</title></head>\n  <body>\n'
    + dsKids(nodes, null).map(n => one(n, '    ')).join('\n')
    + '\n  </body>\n</opml>\n';
}
/* 竖版长图：自己拼一份 SVG（圆角矩形 + 文字 + 贝塞尔连线），
   序列化后交给 <img> 再画进 canvas。
   不用 foreignObject —— 它在部分浏览器里不允许外部资源，也不吃页面字体。 */
function svgTree(ds){
  const nodes = dayOf(ds);
  if(!nodes.length) return null;
  const H = 58, GX = 92, GY = 24, PADX = 56, PADY = 92, GAPR = 36, W = NW;
  const sub = {}, pos = {};
  const subH = n => {
    const ks = dsKids(nodes, n.id);
    if(!ks.length){ sub[n.id] = H; return H; }
    let s = 0;
    ks.forEach((k, i) => { s += subH(k); if(i) s += GY; });
    sub[n.id] = Math.max(H, s);
    return sub[n.id];
  };
  const roots = dsKids(nodes, null);
  roots.forEach(subH);
  const blockH = ks => ks.reduce((a, k, i) => a + sub[k.id] + (i ? GY : 0), 0);
  const place = (n, depth, top) => {
    const ks = dsKids(nodes, n.id);
    const x = PADX + depth * (W + GX);
    if(!ks.length){ pos[n.id] = { x, y: top + (sub[n.id] - H) / 2 }; return; }
    let cur = top + (sub[n.id] - blockH(ks)) / 2;
    ks.forEach(k => { place(k, depth + 1, cur); cur += sub[k.id] + GY; });
    const f = pos[ks[0].id], l = pos[ks[ks.length - 1].id];
    pos[n.id] = { x, y: (f.y + l.y) / 2 };
  };
  let y = PADY;
  roots.forEach(r => { place(r, 0, y); y += sub[r.id] + GAPR; });
  const totalH = Math.max(220, y - GAPR + PADY);
  let maxX = 0;
  Object.keys(pos).forEach(id => { maxX = Math.max(maxX, pos[id].x + W); });
  const totalW = maxX + PADX;

  /* 导出用的配色：与画布同一套色相，但这里不依赖全局状态，自己算一遍 */
  const hueOf = id => {
    let cur = nodes.find(n => n.id === id), last = id;
    const g = new Set();
    while(cur && !g.has(cur.id)){ g.add(cur.id); last = cur.id; if(cur.parentId == null) break; cur = nodes.find(n => n.id === cur.parentId); }
    const ri = Math.max(0, roots.findIndex(r => r.id === last));
    const depth = (() => { let d = 0, c = nodes.find(n => n.id === id); const g2 = new Set();
      while(c && c.parentId != null && !g2.has(c.id)){ g2.add(c.id); d++; c = nodes.find(n => n.id === c.parentId); } return d; })();
    return 'hsl(' + BRANCH_HUES[ri % BRANCH_HUES.length] + ' ' + Math.max(42, 66 - depth * 6)
      + '% ' + (44 + depth * 9) + '%)';
  };
  let body = '';
  nodes.forEach(n => dsKids(nodes, n.id).forEach(k => {
    const a = pos[n.id], b = pos[k.id];
    if(!a || !b) return;
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
    const dx = Math.max(22, (x2 - x1) * 0.5);
    body += '<path d="M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2
      + '" fill="none" stroke="' + hueOf(k.id) + '" stroke-opacity=".45" stroke-width="1.8"/>';
  }));
  nodes.forEach(n => {
    const p = pos[n.id]; if(!p) return;
    const col = hueOf(n.id);
    const span = [n.start, n.end].filter(Boolean).join('–');
    const meta = [span, n.status, n.rating ? n.rating + '/5' : ''].filter(Boolean).join(' · ');
    const one = (n.note || '').replace(/\s+/g, ' ').slice(0, 30);
    body += '<rect x="' + p.x + '" y="' + p.y + '" width="' + W + '" height="' + H + '" rx="11"'
      + ' fill="#ffffff" stroke="' + col + '" stroke-opacity=".55"/>'
      + '<rect x="' + p.x + '" y="' + p.y + '" width="4" height="' + H + '" rx="2" fill="' + col + '"/>'
      + '<text x="' + (p.x + 16) + '" y="' + (p.y + 25) + '" font-size="14" font-weight="600" fill="#151b2b">'
        + xesc(n.title.length > 16 ? n.title.slice(0, 16) + '…' : n.title) + '</text>'
      + '<text x="' + (p.x + 16) + '" y="' + (p.y + 44) + '" font-size="11.5" fill="#6e788e">'
        + xesc((meta + (one ? ' · ' + one : '')).slice(0, 34)) + '</text>';
  });
  const title = (store.projectName || '我的每日记录') + ' · ' + ds + ' ' + weekName(ds);
  const cnt = nodes.length;
  return '<?xml version="1.0" encoding="UTF-8"?>'
    + '<svg xmlns="http://www.w3.org/2000/svg" width="' + totalW + '" height="' + totalH + '"'
    + ' viewBox="0 0 ' + totalW + ' ' + totalH + '" font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif">'
    + '<rect width="' + totalW + '" height="' + totalH + '" fill="#f7f8fb"/>'
    + body
    + '<text x="' + PADX + '" y="' + (PADY - 44) + '" font-size="22" font-weight="700" fill="#151b2b">'
      + xesc(store.projectName || '我的每日记录') + '</text>'
    + '<text x="' + PADX + '" y="' + (PADY - 20) + '" font-size="13" fill="#6e788e">'
      + xesc(ds + ' ' + weekName(ds) + ' · ' + cnt + ' 个分支') + '</text>'
    + '</svg>';
}
function dlBlob(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportPng(ds){
  const svg = svgTree(ds);
  if(!svg){ toast('这一天还没有分支'); return; }
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(2, 2600 / Math.max(1, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    const g = c.getContext('2d');
    g.fillStyle = '#f7f8fb';
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    if(c.toBlob){
      c.toBlob(b => { if(b){ dlBlob('分支记录-' + ds + '.png', b); toast('长图已导出（' + c.width + '×' + c.height + '）'); }
                      else toast('生成图片失败'); }, 'image/png');
    } else toast('当前环境不支持导出图片');
  };
  img.onerror = () => toast('生成图片失败');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

    if(e.key === 'Enter'){ e.preventDefault(); searchFirst(); }
    if(e.key === 'Escape'){ si.value = ''; searchQ = ''; applySearch(); document.getElementById('searchWrap').classList.remove('on'); }
  });
  const pi = document.getElementById('projectInput');
  pi.addEventListener('input', () => { store.projectName = pi.value; save(); });
  pi.addEventListener('change', pushHist);

  /* 小地图：点击 / 拖动定位 */
  const mb = document.getElementById('mmBody');
  const mmSeek = e => {
    const r = mb.getBoundingClientRect();
    const b = boundsOf(); if(!b) return;
    const pad = 40, bw = r.width, bh = r.height;
    const s = Math.min(bw/(b.w+pad*2), bh/(b.h+pad*2));
    const ox = (bw - b.w*s)/2 - (b.x1-pad)*s, oy = (bh - b.h*s)/2 - (b.y1-pad)*s;
    const wx = ((e.clientX - r.left) - ox)/s, wy = ((e.clientY - r.top) - oy)/s;
    panX = innerWidth/2 - wx*zoom; panY = innerHeight/2 - wy*zoom;
    applyTransform();
  };
  mb.addEventListener('pointerdown', e => {
    mmSeek(e);
    const mv = ev => mmSeek(ev);
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    e.preventDefault();
  });

  /* 日期浮层 */
  addEventListener('resize', () => {
    /* 宽屏拖窄：340px 的详情面板会盖住大半画布（窄屏版式还把它变成底部抽屉），
       必须自动收起，别让用户在缩小的窗口里对着一个盖住画布的面板找关闭按钮。
       这一步放在防抖之外——面板挡屏不能等 160ms。 */
    if(isNarrow() && inspOpen){ inspOpen = false; syncInspBtn(); renderInspector(); }
    clearTimeout(window._rzTm);
    window._rzTm = setTimeout(() => { reflow(); drawMinimap(); }, 160);
  });
}

/* ---------- 键盘 ---------- */
function isNKey(e){ return e.key === 'n' || e.key === 'N' || e.code === 'KeyN'; }
document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  const inField = ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName);
  const meta = e.ctrlKey || e.metaKey;
  if(meta && (e.key === 'z' || e.key === 'Z')){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
    return;
  }
  /* 命令面板 / 大纲 / 全部展开：最先响应，焦点在哪都唤得出来 */
  if(meta && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); openPalette(''); return; }
  if(meta && e.key === '\\'){ e.preventDefault(); openOutline(); return; }
  if(e.altKey && !meta && (e.key === 'e' || e.key === 'E')){ e.preventDefault(); toggleAllOpen(); return; }
  if(e.key === 'Escape'){
    /* 命令面板是最上层的浮层，先关它 */
    if(palOpen){ closePalette(); return; }
    /* 大图预览在最上层，其次关它 */
    if(document.getElementById('lightbox').classList.contains('on')){ closeLightbox(); return; }
    /* 然后再管编辑态和弹层。结束编辑按 editId 判断、不看焦点在哪：
       卡片一旦重渲染（加图片、切状态等）输入框就被整个换掉、焦点掉回 body，
       只靠 focus 判断的话 Esc 会失灵。 */
    if(document.getElementById('mask').classList.contains('on')){ closeModal(); return; }
    if(editId){ exitEdit(); return; }
    /* 连续拆分模式：Esc 解锁 */
    if(chainPid){ setChain(chainPid); return; }
    document.getElementById('ctx').classList.remove('on');
    document.getElementById('pop').classList.remove('on');
    const w = document.getElementById('searchWrap');
    if(w.classList.contains('on')){ w.classList.remove('on'); document.getElementById('searchInput').value = ''; searchQ = ''; applySearch(); }
    return;
  }
  if(inField) return;
  if(e.key === 'Tab'){ e.preventDefault(); toggleCollapseSel(); }
  else if(e.key === 'Enter'){
    /* 卡片编辑态里的回车由卡片自己处理（见 #nodes 的 keydown） */
    if(editId) return;
    e.preventDefault();
    /* 锁定模式：回车 = 继续往同一支下加一个（连续拆分，手不用离开键盘） */
    if(chainPid && byId(chainPid)){ addBranch(chainPid); return; }
    if(selId && byId(selId)){
      const nn = addSiblingOf(selId);
      if(nn){
        selId = nn.id; render(); enterEdit(nn.id, 'title');
        requestAnimationFrame(() => revealNode(nn.id, { h: 320, padBottom: 70 }));
      }
    }
  }
  else if(isNKey(e)){ e.preventDefault(); addBranch(selId && byId(selId) ? selId : null); }
  else if(e.key === 'Delete' && selId && byId(selId)){ delAsk(selId); }
  else if(e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    const flat = flattenVis();
    const i = flat.findIndex(n => n.id === selId);
    if(i === -1) return;
    e.preventDefault();
    const j = (e.key === 'ArrowUp' || e.key === 'ArrowLeft')
      ? Math.max(0, i-1) : Math.min(flat.length-1, i+1);
    selectNode(flat[j].id, { center:true });
  }
  else if(e.key === '0' || e.key === 'f' || e.key === 'F'){ fitView(); }
  else if(meta && e.shiftKey && (e.key === 'l' || e.key === 'L')){ e.preventDefault(); autoArrange('full'); }
  else if(e.key === '+' || e.key === '='){ setZoom(zoom * 1.18); }
  else if(e.key === '-' || e.key === '_'){ setZoom(zoom / 1.18); }
});
function toggleCollapseSel(){
  const n = selId ? byId(selId) : null;
  if(!n || !childrenOf(n.id).length){ if(n) toast('这个分支还没有子分支'); return; }
  n.collapsed = !n.collapsed; save(); pushHist(); render();
}
